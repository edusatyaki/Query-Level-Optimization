  {note:'The caveat, and say it twice. ANALYZE truly executes. Never run it on an UPDATE or DELETE unless it is wrapped in a transaction you roll back.'}],
  body:(st)=>`<div class="cards" style="grid-template-columns:repeat(3,minmax(0,1fr))">
      <div class="pop">${card('The estimate','EXPLAIN','Fast. Does <b>not</b> run the query — shows the plan it would use.','tl',ico('search'))}</div>
      ${st>=1?`<div class="pop">${card('Estimate + reality','EXPLAIN ANALYZE','Actually runs the query; real timings and real row counts beside the estimates.','pp',ico('gauge'))}</div>`:''}
      ${st>=2?`<div class="pop">${card('+ cache vs disk','(ANALYZE, BUFFERS)','Also shows how many data pages came from cache vs. were fetched from disk.','good',ico('db'))}</div>`:''}
    </div>
    ${st>=1?sql(`EXPLAIN ANALYZE SELECT * FROM orders WHERE total_amount > 5000;`):''}
    ${st>=3?tell('Caveat','ANALYZE truly executes. Never run it on an <code>UPDATE</code> / <code>DELETE</code> unless wrapped in a transaction you roll back.','warn'):''}` },

{ id:'node', kick:'how to read a node', eyebrow:'Define', title:'Anatomy of one plan node',
  tag:'explain', steps:[
  {note:'This is one node, exactly as EXPLAIN ANALYZE prints it. We will read it token by token.'},
  {note:'Seq Scan — read the entire table, row by row. This is the smell.'},
  {note:'cost, zero to 358,458 — startup cost, then total cost. Lower is better.'},
  {note:'rows equals 95,000 — the planner\'s estimate of rows this node will emit.'},
  {note:'width equals 24 — average bytes per row. Wider means more I/O, which is why SELECT star costs more.'},
  {note:'actual time — real milliseconds, first row to last row. 2.1 seconds on this node alone.'},
  {note:'rows equals 98,211, loops equals 1 — actual rows, and how many times the node ran. Compare with the estimate.'},
  {note:'And the line that is often the whole diagnosis: Rows Removed by Filter. It read about twenty million rows and threw away 19.9 million.'}],
  body:(st)=>{
    const on = n => st === n ? 'on' : '';
    const A = [
      ['<code>Seq Scan</code> — read the <b>entire</b> table row by row. This is the smell.'],
      ['<code>cost=0.00..358458</code> — startup .. total. Lower is better.'],
      ['<code>rows=95000</code> — the planner\'s <b>estimate</b> of rows emitted.'],
      ['<code>width=24</code> — avg bytes per row. Wider = more I/O.'],
      ['<code>actual time=..2140.870</code> — real ms, first row .. last row.'],
      ['<code>rows=98211 loops=1</code> — actual rows, and how many times it ran.'],
      ['<code>Rows Removed by Filter</code> — read ~20M, threw away <b>19.9M</b>. Often the whole diagnosis.']];
    return `<div class="two wl">
      <pre class="plan"><span class="${on(1)}">Seq Scan</span> on orders
  (<span class="${on(2)}">cost=0.00..358458.00</span> <span class="${on(3)}">rows=95000</span> <span class="${on(4)}">width=24</span>)
  (<span class="${on(5)}">actual time=0.015..2140.870</span>
   <span class="${on(6)}">rows=98211 loops=1</span>)
  Filter: (total_amount &gt; 5000)
  <span class="bad ${on(7)}">Rows Removed by Filter: 19901789</span></pre>
      <div class="anno">${A.map((a,i)=> st>=i+1 ? `<div class="pop ${st===i+1?'on':''} ${i===6?'warn':''}">${a[0]}</div>`:'').join('')}</div>
    </div>`; } },

{ id:'smells', kick:'what to look for', eyebrow:'Define', title:'The plan-smell checklist',
  tag:'explain', steps:[
  {note:'Six things to look for in a plan. Each card has the same three lines: what you see in the plan, what it means in plain words, and the fix. First: a Seq Scan on a big table when you only wanted a few rows. It read the whole table. Fix: give it an index.'},
  {note:'Two: the planner\'s guess and reality disagree — it guessed a hundred rows, two million came back. Its statistics are out of date. Fix: run ANALYZE on the table.'},
  {note:'Three: Rows Removed by Filter is huge. It read millions of rows and threw almost all of them away. Fix: an index, so it only reads the rows you want.'},
  {note:'Four: Sort Method external merge, Disk. The sort did not fit in memory and spilled to disk, which is slow. Fix: sort fewer rows — a LIMIT, or an index that is already sorted. You want quicksort, Memory.'},
  {note:'Five: a Nested Loop with a huge loops count. The same lookup was repeated millions of times — usually a correlated subquery. Fix: rewrite with EXISTS or a JOIN, or index the inner side.'},
  {note:'And six, the good one: Execution Time at the bottom. That is your headline number — measure it before, and again after every fix.'}],
  body:(st)=>{
    /* tiny drawings, one per smell (viewBox 120×60) */
    const box = (x,y,w,h,f) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="${f}" stroke="var(--ink)" stroke-width="1.6"/>`;
    const PIC = [
      /* every row read, one kept */
      [...Array(8)].map((_,i)=>box(4+i*14,18,11,24, i===5?'var(--amber)':'var(--flame-soft)')).join('') +
        `<path d="M2,50 H116" stroke="var(--flame)" stroke-width="3" stroke-linecap="round" marker-end="url(#smA)"/>`,
      /* the guess vs the real number */
      `<text x="2" y="16" style="font-family:var(--hand);font-size:11px;fill:var(--muted)">guess</text>${box(36,7,4,12,'var(--pencil)')}
       <text x="2" y="44" style="font-family:var(--hand);font-size:11px;fill:var(--muted)">real</text>${box(36,34,80,14,'var(--flame)')}`,
      /* many in, almost all thrown away */
      [...Array(7)].map((_,i)=>box(4,4+i*8,22,5,'var(--pencil-soft)')).join('') +
        `<path d="M30,30 H52" stroke="var(--ink)" stroke-width="2" marker-end="url(#smA)"/>
         <path d="M56,8 L96,8 L82,30 L82,46 L70,52 L70,30 Z" fill="var(--card)" stroke="var(--ink)" stroke-width="1.8"/>${box(100,40,16,8,'var(--amber)')}
         <text x="108" y="34" text-anchor="middle" style="font-family:var(--hand);font-size:10px;fill:var(--muted)">kept</text>`,
      /* memory box overflowing to disk */
      `${box(4,10,46,40,'var(--pencil-soft)')}${[...Array(4)].map((_,i)=>box(8,14+i*9,38,6,'var(--flame)')).join('')}
       <path d="M52,30 H70" stroke="var(--flame)" stroke-width="2.4" marker-end="url(#smA)"/>
       <ellipse cx="96" cy="16" rx="20" ry="6" fill="var(--flame-soft)" stroke="var(--ink)" stroke-width="1.6"/>
       <path d="M76,16 V44 C76,48 85,52 96,52 C107,52 116,48 116,44 V16" fill="var(--flame-soft)" stroke="var(--ink)" stroke-width="1.6"/>
       <text x="96" y="38" text-anchor="middle" style="font-family:var(--hand);font-size:11px">disk</text>`,
      /* the same trip, again and again */
      `${box(4,20,30,22,'var(--card)')}${box(86,20,30,22,'var(--pencil-soft)')}
       ${[0,1,2].map(i=>`<path d="M34,${26+i*5} C55,${8+i*6} 66,${8+i*6} 86,${26+i*5}" fill="none" stroke="var(--flame)" stroke-width="1.8" stroke-dasharray="4 3"/>`).join('')}
       <text x="60" y="56" text-anchor="middle" style="font-family:var(--hand);font-size:11px;fill:var(--flame-ink)">&times; 2,000,000</text>`,
      /* the stopwatch */
      `<circle cx="60" cy="32" r="22" fill="var(--leaf-soft)" stroke="var(--ink)" stroke-width="2"/>
       <rect x="55" y="4" width="10" height="6" rx="1" fill="var(--ink)"/>
       <path d="M60,32 L60,18 M60,32 L70,38" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/>`];
    const S = [
      ['Seq Scan on a big table',      'Seq Scan on orders',                      'Read the <b>whole table</b> for a few rows.',            'an <b>index</b> on the filter column.'],
      ['Guess ≠ reality',              'rows=100 … actual rows=2000000',          'The planner <b>guessed wrong</b> &mdash; old stats.',   '<code>ANALYZE orders;</code>'],
      ['Rows Removed by Filter: huge', 'Rows Removed by Filter: 19901789',        'Read millions, <b>threw almost all away</b>.',            'an <b>index</b> &mdash; read only what you need.'],
      ['Sort spilled to disk',         'Sort Method: external merge  Disk',       'The sort <b>didn\'t fit in memory</b>.',           'sort fewer rows: <code>LIMIT</code> or a sorted index.'],
      ['Nested Loop, huge loops=',     'Nested Loop … loops=2000000',             'The <b>same lookup</b>, millions of times.',           'use <code>EXISTS</code> / <code>JOIN</code>, or index the inner side.'],
      ['Execution Time',               'Execution Time: 2140.870 ms',             'The <b>one number</b> to report.',                              'measure it <b>before and after</b> every fix.']];
    return `<svg width="0" height="0" style="position:absolute"><defs><marker id="smA" viewBox="0 0 10 10" refX="8" refY="5"
        markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/></marker></defs></svg>
      <div class="smells">${S.map((x,i)=> st>=i ? `<div class="smell pop ${i===5?'good':''}">
        <div class="hd"><span class="no">${i+1}</span><span class="nm">${x[0]}</span></div>
        <div class="pic"><svg viewBox="0 0 120 60" aria-hidden="true">${PIC[i]}</svg></div>
        <div class="ln"><span class="k">You see</span><span class="see">${x[1]}</span></div>
        <div class="ln"><span class="k">It means</span><span class="means">${x[2]}</span></div>
        <div class="ln"><span class="k">${i===5?'Use it':'Fix'}</span><span class="fix">${x[3]}</span></div></div>`:'').join('')}</div>`; } },

{ id:'vocab', kick:'the words plans speak', eyebrow:'Define · vocabulary', title:'Scans and joins',
  tag:'explain', steps:[
  {note:'Scan types, slowest to fastest. Seq Scan reads the whole table.'},
  {note:'Bitmap Index Scan — for a medium number of matches. It collects row locations from the index, then reads the pages in order.'},
  {note:'Index Scan — jump via the index, then fetch each row from the table.'},
  {note:'Index Only Scan — answered from the index alone, never touching the table. The fastest.'},
  {note:'Join methods. Nested Loop for small sets or an indexed inner side; Hash Join for large unsorted sets; Merge Join when both inputs are already sorted. The planner picks the join from the shape and size of its inputs — and indexes change that shape.'}],
  body:(st)=>{
    const S = [['Seq Scan','read the whole table',100,'var(--flame)'],['Bitmap Index Scan','a medium number of matches',55,'var(--amber-2)'],
               ['Index Scan','jump via index, then fetch rows',25,'var(--pencil)'],['Index Only Scan','answered from the index alone',8,'var(--leaf)']];
    return `<div class="two">
      <div class="rows" style="--cols:9rem 1fr 6rem">
        ${S.map((s,i)=> st>=i ? `<div class="row pop"><b style="font-size:.8rem">${s[0]}</b><span>${s[1]}</span>
          <span style="display:block;height:.6rem;width:${s[2]}%;background:${s[3]};border:2px solid var(--ink);border-radius:3px"></span></div>`:'').join('')}
        <div class="verdict" style="color:var(--muted)">scan types &mdash; slow &rarr; fast (bar = work)</div>
      </div>
      ${st>=4?`<div class="stack pop">
        ${card('Join','Nested Loop','Small sets, or an indexed inner side.','tl')}
        ${card('Join','Hash Join','Large, unsorted sets.','pp')}
        ${card('Join','Merge Join','Both inputs already sorted.','good')}
        <p class="lede" style="font-size:.72rem">The planner picks the join from the shape and size of its inputs &mdash; <b>indexes change that shape</b>.</p>
      </div>`:'<div></div>'}</div>`; } },

{ id:'before', kick:'apply · our scenario', eyebrow:'Our "before" picture', title:'Every row read. Almost all thrown away.',
  tag:'apply', steps:[
  {note:'Here is the query and the plan. Run EXPLAIN ANALYZE on the orders filter.'},
  {note:'Seq Scan on orders. The database reads every row of the twenty-million-row table. Watch the scan head — the amber squares are the only rows it keeps.'},
  {note:'Rows removed: 19,901,789. Nearly twenty million rows read and thrown away.'},
  {note:'Execution time: 2,140 milliseconds. Hold this plan in mind. Every technique today is judged by one question: does this Seq Scan disappear, and does this time drop?'}],
  body:(st)=>`${sql(`EXPLAIN ANALYZE SELECT * FROM orders WHERE total_amount > 5000;`)}
    <div class="stage-row">${sceneSeqScan(st)}</div>
    ${st>=2?`<div class="stats pop">
      <div class="stat warn"><div class="k">Node</div><div class="v" style="font-size:1.4rem">Seq Scan on orders</div><div class="s">reads every row of 20M</div></div>
      <div class="stat warn"><div class="k">Rows removed</div><div class="v">19,901,789</div><div class="s">read and thrown away</div></div>
      ${st>=3?`<div class="stat warn pop"><div class="k">Execution time</div><div class="v">2,140 ms</div><div class="s">our headline number</div></div>`:'<div></div>'}
    </div>`:''}
    ${st>=3?tell('The test','Does this <b>Seq Scan</b> disappear, and does this <b>time</b> drop?','note'):''}` },

{ id:'quiz2', kick:'checkpoint · segment 2', eyebrow:'Check yourself', title:'Can you read the disease?',
  tag:'checkpoint', steps:quizSteps(Q2), body:(st)=>quiz(Q2, st) },

/* ================= 4 · the free wins ================= */
{ id:'t1', kick:'trick 1 · select only the columns you need', eyebrow:'Trick 1 of 6', title:'Stop shipping columns you never show',
  tag:'trick', steps:[
  {note:'Why: fewer, narrower columns means a smaller width and less I/O. And it is a precondition for the fast Index Only Scan later — an index cannot cover SELECT star.'},
  {note:'The fix: ask for what the dashboard shows. customer_id and name.'},
  {note:'The plan tell: the width value drops — here from 210 bytes a row to 32.'}],
  body:(st)=>`<p class="lede"><b>Why:</b> fewer, narrower columns = smaller <code>width</code> = less I/O &mdash; and it's a precondition for the fast <b>Index-Only Scan</b> later.</p>
    <div class="pair">
      <div><span class="verdict bad">&#10005; Wider than needed</span>${sql(`SELECT [[!*]] FROM customers
WHERE city = 'Pune';   -- width=210`)}</div>
      ${st>=1?`<div class="pop"><span class="verdict good">&check; Only what you show</span>${sql(`SELECT [[customer_id, name]] FROM customers
WHERE city = 'Pune';   -- width=32`)}</div>`:'<div></div>'}</div>
    <div class="stage-row">${sceneWidth(st>=1?1:0,'width = 210','width = 32')}</div>
    ${st>=2?tell('Plan tell','the <code>width=</code> value drops.'):''}` },

{ id:'t2', kick:'trick 2 · keep filters sargable', eyebrow:'Trick 2 of 6', title:'Don\'t wrap an indexed column in a function',
  tag:'trick', steps:[
  {note:'Why: the index is built on the raw column, not on the function\'s output. Wrap the column in LOWER and the index cannot be used — the planner falls back to a Seq Scan.'},
  {note:'Keep the column bare. Store emails lower-cased, compare the raw value.'},
  {note:'Same trap with dates: casting order_date to text to use LIKE defeats the range.'},
  {note:'Write it as a half-open range instead: greater-or-equal to January first, less than next January first.'},
  {note:'Plan tell: a Seq Scan flips to an Index Scan once the column is left bare. And later today we will meet the other fix — an expression index on LOWER(email).'}],
  body:(st)=>`<p class="lede"><b>Why:</b> the index is built on the <b>raw column</b>, not the function's output &mdash; so a function on the column forces a Seq Scan.</p>
    <div class="pair">
      <div><span class="verdict bad">&#10005; Function kills the index</span>${sql(`SELECT * FROM customers
WHERE [[!LOWER(email)]] = 'amit@shop.com';`)}</div>
      ${st>=1?`<div class="pop"><span class="verdict good">&check; Keep the column bare</span>${sql(`SELECT * FROM customers
WHERE [[email]] = 'amit@shop.com';`)}</div>`:'<div></div>'}</div>
    ${st>=2?`<div class="pair pop">
      <div><span class="verdict bad">&#10005; Cast defeats the range</span>${sql(`WHERE [[!order_date::text]] LIKE '2025%';`)}</div>
      ${st>=3?`<div class="pop"><span class="verdict good">&check; Range-friendly dates</span>${sql(`WHERE order_date >= '2025-01-01'
  AND order_date <  '2026-01-01';`)}</div>`:'<div></div>'}</div>`:''}
    ${st>=4?tell('Plan tell','a <b>Seq Scan</b> flips to an <b>Index Scan</b> once the column is left bare. (Or later: an expression index on <code>LOWER(email)</code>.)'):''}` },

{ id:'t3', kick:'trick 3 · join / exists over correlated subqueries', eyebrow:'Trick 3 of 6', title:'Don\'t re-run the inner query per row',
  tag:'trick', steps:[
  {note:'The correlated subquery. For every one of two million customers, count their orders. The inner query runs once per outer row.'},
  {note:'Rewrite as a JOIN with DISTINCT — one pass over each table. Keep the key in the DISTINCT: DISTINCT c.name alone would merge two different customers who share a name.'},
  {note:'Or, best when you only care whether something exists: EXISTS. It can stop at the first matching order.'},
  {note:'Plan tell: the per-row SubPlan, with a huge loops count, becomes a single Hash Semi Join. Watch the picture — two million trips become one build and one probe. Measured live: about three hours for the correlated version, a quarter of a second for EXISTS.'}],
  body:(st)=>`<div class="pair" style="--n:3">
      <div><span class="verdict bad">&#10005; Correlated subquery</span>${sql(`SELECT name FROM customers c
WHERE ([[!SELECT COUNT(*)]]
       [[!FROM orders o]]
       [[!WHERE o.customer_id]]
       [[!  = c.customer_id]]) > 0;`,'sm')}</div>
      ${st>=1?`<div class="pop"><span class="verdict good">&check; JOIN</span>${sql(`SELECT DISTINCT [[c.customer_id]], c.name
FROM customers c
JOIN orders o
  ON o.customer_id
   = c.customer_id;`,'sm')}</div>`:'<div></div>'}
      ${st>=2?`<div class="pop"><span class="verdict good">&check; EXISTS (best for existence)</span>${sql(`SELECT c.name FROM customers c
WHERE [[EXISTS]] (
  SELECT 1 FROM orders o
  WHERE o.customer_id
      = c.customer_id);`,'sm')}</div>`:'<div></div>'}</div>
    ${st>=3?`<div class="stage-row pop">${sceneLoops(1)}</div>${tell('Plan tell','a per-row <b>SubPlan</b> with a huge <code>loops=</code> becomes a single <b>Hash Semi Join</b>. Keep the key in <code>DISTINCT</code> — <code>DISTINCT c.name</code> alone merges namesakes.')}`:''}` },

{ id:'t4', kick:'trick 4 · rewrite OR into IN / UNION', eyebrow:'Trick 4 of 6', title:'Unblock the index the OR was hiding',
  tag:'trick', steps:[
  {note:'On one column, OR and IN are close cousins. Modern PostgreSQL already uses an index for both — a BitmapOr for the OR, a single equals-ANY for the IN. Prefer IN: it is cleaner and easier to build from code, but do not promise a big speed-up.'},
  {note:'The OR that really hurts spans two tables: Amit\'s orders, or order 880231. The condition can only be checked after joining everything, so neither index can be used — a Join Filter throws away two million rows.'},
  {note:'Split it into a UNION. Each branch is a simple query that seeks its own index — the email index, and the primary key. Measured live: about 365 milliseconds down to well under one.'},
  {note:'Plan tell: a hash join with a giant Join Filter becomes two index lookups glued by UNION.'}],
  body:(st)=>`<div class="pair">
      <div><span class="verdict good">&check; One column &mdash; IN (OR works too)</span>${sql(`SELECT * FROM orders
WHERE status [[IN]] ('pending', 'cancelled');
-- OR on the same column also uses the
-- index (BitmapOr); IN is just cleaner`,'sm')}</div>
      ${st>=1?`<div class="pop"><span class="verdict bad">&#10005; OR across two tables</span>${sql(`SELECT o.order_id, o.total_amount
FROM orders o JOIN customers c
  ON c.customer_id = o.customer_id
WHERE c.email = 'amit@shop.com'
   [[!OR]] o.order_id = 880231;`,'sm')}</div>`:'<div></div>'}</div>
    ${st>=2?`<div class="pop"><span class="verdict good">&check; UNION &mdash; each branch seeks its own index</span>${sql(`SELECT o.order_id, o.total_amount FROM orders o JOIN customers c ON c.customer_id = o.customer_id
WHERE c.email = 'amit@shop.com'
[[UNION]]
SELECT order_id, total_amount FROM orders WHERE order_id = 880231;`,'sm')}</div>`:''}
    ${st>=3?tell('Plan tell','a Hash Join with a giant <code>Join Filter</code> becomes two <b>Index Scans</b> glued by <code>UNION</code>.'):''}` },

{ id:'t5', kick:'trick 5 · push LIMIT down · drop needless DISTINCT / ORDER BY', eyebrow:'Trick 5 of 6', title:'Don\'t sort millions to show twenty',
  tag:'trick', steps:[
  {note:'If you show twenty rows, do not sort and materialize millions. With a matching index on customer_id and order_date, the planner reads just the first twenty and stops early.'},
  {note:'A needless DISTINCT can add a whole sort or hash-aggregate node. If the rows are already unique, remove it and the node disappears.'},
  {note:'Plan tell: a Sort over millions shrinks or vanishes, and the top node\'s actual rows drops to twenty.'}],
  body:(st)=>`<div class="two wl">
      <div class="stack"><span class="verdict good">&check; Let the planner stop early</span>${sql(`SELECT order_id, total_amount
FROM orders
WHERE customer_id = 1024
ORDER BY order_date DESC
[[LIMIT 20]];`,'lg')}</div>
      <div class="stack">
        <div class="pop">${card('Why','Show 20, read 20','If you show 20 rows, don\'t sort and materialize millions. With a matching index the planner reads just the first 20.','good',ico('bolt'))}</div>
        ${st>=1?`<div class="pop">${card('And','Drop needless DISTINCT','A needless <code>DISTINCT</code> can add a whole sort / hash-aggregate node. Remove it and the node disappears.','warn',ico('trash'))}</div>`:''}
      </div></div>
    ${st>=2?tell('Plan tell','a <b>Sort</b> over millions shrinks or vanishes; the top node\'s actual rows drops to <b>20</b>.'):''}` },

{ id:'t6', kick:'trick 6 · keep statistics fresh', eyebrow:'Trick 6 of 6', title:'A good plan needs good estimates',
  tag:'trick', steps:[
  {note:'Why: the planner\'s choices are only as good as its row estimates. After a big data load — like Black Friday — the estimates go stale, and it picks bad plans. Here it thinks a hundred rows, and gets two million.'},
  {note:'Run ANALYZE on the table, then re-run EXPLAIN. Often the plan changes on its own — no rewrite needed. Autovacuum usually does this for you, but do it by hand after a bulk load.'},
  {note:'Plan tell: the gap between estimated and actual rows closes.'}],
  body:(st)=>`<div class="two wl">
      <div class="stage-row">${sceneStats(st)}</div>
      <div class="stack">
        ${sql(`ANALYZE orders;
-- then re-run:
EXPLAIN SELECT ...;`,'lg')}
        ${st>=1?`<p class="lede pop" style="font-size:.78rem">Often the plan changes on its own &mdash; no rewrite needed. <b>autovacuum</b> usually does this, but do it by hand after a bulk load.</p>`:''}
      </div></div>
    ${st>=2?tell('Plan tell','the estimated-vs-actual rows gap closes.'):''}` },

{ id:'quiz3', kick:'checkpoint · segment 3', eyebrow:'Check yourself', title:'Three sins in one query',
  tag:'checkpoint', steps:quizSteps(Q3, 'Our dashboard query used SELECT star, a LOWER on email, and a correlated subquery — three of six sins at once.'),
  body:(st)=>`${tell('Confession','Our dashboard query used <code>SELECT *</code>, a <code>LOWER()</code> on email, and a correlated subquery &mdash; three of six sins at once.','warn')}${quiz(Q3, st)}` },

/* ================= 5 · CTEs ================= */
{ id:'cteneed', kick:'need · the problem', eyebrow:'The dashboard query today', title:'Can you even find the bug?',
  tag:'cte', steps:[
  {note:'This is the real dashboard query. Give them ten seconds to read it.'},
  {note:'The same SUM is computed twice — once to filter, once to display. For every customer.'},
  {note:'Would you want to maintain it? We need to name a sub-result and reuse it.'}],
  body:(st)=>{
    const m = s => st>=1 ? `[[!${s}]]` : s;
    return `<div class="two wl">${sql(`SELECT name, spent FROM (
  SELECT c.name,
    (${m('SELECT SUM(total_amount) FROM orders o')}
     ${m('WHERE o.customer_id = c.customer_id')}
     ${m("AND o.order_date >= date_trunc('month', now())")}) AS spent
  FROM customers c
  WHERE (${m('SELECT SUM(total_amount) FROM orders o')}
         ${m('WHERE o.customer_id = c.customer_id')}
         ${m("AND o.order_date >= date_trunc('month', now())")}) > 0
) t
ORDER BY spent DESC LIMIT 20;`)}
      <div class="stack">
        ${st>=1?`<div class="pop">${card('The bug','The same SUM, twice','Once to filter, once to display &mdash; per customer.','warn',ico('sigma'))}</div>`:''}
        ${st>=2?`<p class="quote pop">We need to name a sub-result and reuse it.</p>`:''}
      </div></div>`; } },

{ id:'ctedef', kick:'define · syntax & shape', eyebrow:'Common Table Expressions', title:'The same query, named and readable',
  tag:'cte', steps:[
  {note:'WITH, a name, AS, and a query in brackets. That names a query block you can reference below — for that one statement only.'},
  {note:'The aggregate is written once. SUM and COUNT per customer, for this month.'},
  {note:'Then the main query reads like a sentence: join the totals to customers, and take the top twenty.'},
  {note:'The intent now reads top to bottom. And one extra: WITH RECURSIVE handles hierarchies — category trees, org charts.'}],
  body:(st)=>`<div class="two wl">${sql(`WITH [[customer_totals]] AS (
  SELECT customer_id,
         ${st>=1?'[[SUM(total_amount) AS spent]]':'SUM(total_amount) AS spent'},
         COUNT(*) AS num_orders
  FROM orders
  WHERE order_date >= date_trunc('month', CURRENT_DATE)
  GROUP BY customer_id
)
SELECT c.name, ct.spent, ct.num_orders
FROM ${st>=2?'[[customer_totals ct]]':'customer_totals ct'}
JOIN customers c ON c.customer_id = ct.customer_id
ORDER BY ct.spent DESC LIMIT 20;`,'sm')}
      <div class="stack">
        <p class="lede" style="font-size:.8rem">A CTE (<code>WITH … AS (…)</code>) names a query block you can reference below, <b>for that one statement</b>.</p>
        ${st>=1?`<p class="lede pop" style="font-size:.8rem">The aggregate is written <b>once</b>. The intent reads top to bottom.</p>`:''}
        ${st>=3?tell('Also','<code>WITH RECURSIVE</code> handles hierarchies &mdash; category trees, org charts.','note'):''}
      </div></div>
    <div class="stage-row">${sceneCTEFlow(st)}</div>` },

{ id:'inline', kick:'PostgreSQL 12+', eyebrow:'Define', title:'Inlined by default — you can override',
  tag:'cte', steps:[
  {note:'A CTE that is referenced once is inlined by default — folded into the main query, so the planner can optimize across it. For example, it can push a filter down into the block. Careful: referenced twice or more, PostgreSQL materializes it by default.'},
  {note:'AS MATERIALIZED: compute the block once, store the result, reuse it. Great when the block is expensive and referenced two or more times.'},
  {note:'AS NOT MATERIALIZED: force inlining even when it is referenced several times, so the planner can push filters and joins inside. The price: the block is computed once per reference — measured live, a CTE used twice took twice as long inlined.'},
  {note:'Rule of thumb: inline for the planner\'s freedom; materialize only when an expensive block is genuinely reused.'}],
  body:(st)=>`<p class="lede">Referenced <b>once</b>, a CTE is <b>inlined</b> by default &mdash; folded into the main query so the planner can optimize across it (e.g. push filters down). Referenced <b>2+ times</b>, it is materialized by default.</p>
    <div class="cards" style="grid-template-columns:1fr 1fr">
      ${st>=1?`<div class="pop">${card('Compute once','AS MATERIALIZED','Compute the block <b>once</b>, store the result, reuse it. Great when the block is expensive and referenced 2+ times.','pp',ico('layers'))}</div>`:''}
      ${st>=2?`<div class="pop">${card('Force inlining','AS NOT MATERIALIZED','Force inlining even when referenced multiple times, so the planner can push filters and joins inside &mdash; at the cost of computing it once per reference.','tl',ico('route'))}</div>`:''}
    </div>
    ${st>=1?sql(`WITH customer_totals AS [[MATERIALIZED]] ( ... )   -- or: AS NOT MATERIALIZED`):''}
    ${st>=3?tell('Rule of thumb','inline for the planner\'s freedom; materialize only when an expensive block is genuinely reused.'):''}` },

{ id:'trap', kick:'evaluate · when CTEs hurt', eyebrow:'The materialization trap', title:'A wall the filter can\'t cross',
  tag:'cte', steps:[
  {note:'Materialize all of orders, then look up one id. The CTE computes all twenty million rows first, and the WHERE cannot push inside. Disaster — a CTE Scan over twenty million rows to return one.'},
  {note:'Inline it and the filter pushes into the block, and it returns one row through the primary-key index.'},
  {note:'History worth knowing: before PostgreSQL 12, every CTE was an optimization fence — an easy way to slow things down by accident.'}],
  body:(st)=>`${sql(`WITH all_orders AS [[!MATERIALIZED]] (SELECT * FROM orders)   -- computes ALL 20M rows
SELECT * FROM all_orders WHERE order_id = 42;                -- filter can't push in`)}
    <div class="stage-row">${sceneTrap(st)}</div>
    ${st>=2?tell('History','On PostgreSQL &lt; 12 every CTE was an <b>"optimization fence"</b> &mdash; an easy way to accidentally slow things down.','warn'):''}` },

{ id:'quiz4', kick:'checkpoint · segment 4', eyebrow:'Check yourself', title:'Inline, or materialize?',
  tag:'checkpoint', steps:quizSteps(Q4, 'Our customer_totals CTE is referenced once, so it inlines cleanly — readability at no cost.'),
  body:(st)=>`${tell('Our query','<code>customer_totals</code> is referenced once &rarr; it inlines cleanly. Readability at no cost.')}${quiz(Q4, st)}` },

/* ================= 6 · indexing ================= */
{ id:'book', kick:'need · the idea', eyebrow:'Indexing', title:'Like the index at the back of a book',
  tag:'index', steps:[
  {note:'To find every mention of photosynthesis without an index, you read all 900 pages. That is a Seq Scan.'},
  {note:'With the index, you flip to the entry and jump straight to the right pages. That is an Index Scan. The database keeps a sorted, quick-lookup structure so it can find rows without reading the whole table.'}],
  body:(st)=>`<div class="stage-row">${sceneBook(st)}</div>
    ${st>=1?`<p class="lede pop">The database keeps a <b>sorted, quick-lookup structure</b> so it can find rows without reading the whole table.</p>`:''}` },

{ id:'types', kick:'5.1 · types by access method', eyebrow:'Five structures', title:'Mostly you want B-tree',
  tag:'index', steps:[
  {note:'B-tree: equality and range — equals, less than, greater than, BETWEEN, ORDER BY. The default, and about ninety percent of the indexes you will ever create.'},
  {note:'Hash: equality only. Rarely worth it over a B-tree.'},
  {note:'GIN: many values per row — jsonb, arrays, full-text search.'},
  {note:'GiST: geometric and nearest-neighbour — maps, ranges, "stores near me".'},
  {note:'BRIN: a tiny index for huge, naturally ordered tables — append-only time series. We will open each one up next.'}],
  body:(st)=>{
    const T = [['B-tree','Equality & range (<code>=, &lt;, &gt;, BETWEEN, ORDER BY</code>). The default &mdash; ~90% of indexes.','order_date, total_amount, FKs'],
               ['Hash','Equality only (<code>=</code>). Rarely worth it over B-tree.','pure lookups'],
               ['GIN','Many values per row: jsonb, arrays, full-text search.','tags text[], descriptions'],
               ['GiST','Geometric & nearest-neighbor (maps, ranges).','"stores near me"'],
               ['BRIN','Tiny index for huge, naturally-ordered tables.','order_date on an 80M log']];
    return `<div class="rows" style="--cols:5.5rem 1fr 11rem">
      ${T.map((t,i)=> st>=i ? `<div class="row pop ${i===0?'hot':''}"><b>${t[0]}</b><span>${t[1]}</span><span class="ex">${t[2]}</span></div>`:'').join('')}</div>`; } },

{ id:'btree', kick:'how it works · B-tree', eyebrow:'A sorted, balanced tree', title:'Root, branch, leaf',
  tag:'index', steps:[
  {note:'Keys stay sorted across a multi-level tree, and every leaf sits at the same depth. That is the balanced part.'},
  {note:'A lookup walks root, branch, leaf, comparing at each step. Find 70: it is between 40 and 80, so the middle branch; then the leaf. That is O(log n) — a few page reads even over twenty million rows.'},
  {note:'The leaves are linked in order, so a range just walks the chain. That is why a B-tree serves equals, less than, greater than, BETWEEN and ORDER BY.'},
  {note:'In SQL: an index on order_date serves the whole month of November as one walk along the leaves.'}],
  body:(st)=>`<div class="stage-row">${sceneBtree(st)}</div>
    ${st>=3?sql(`CREATE INDEX ON orders (order_date);
-- serves WHERE order_date BETWEEN '2025-11-01' AND '2025-11-30'`):''}` },

{ id:'hash', kick:'how it works · hash', eyebrow:'One jump straight to the bucket', title:'Hash index',
  tag:'index', steps:[
  {note:'The key goes in on the left — a session token.'},
  {note:'It runs through a hash function to get a bucket number, and the database searches only that bucket. Roughly O(1) for equality — no tree levels to walk.'},
  {note:'But it stores no order. So it cannot help less-than, greater-than, BETWEEN, ORDER BY, or a prefix LIKE. A B-tree usually wins, because it does equality and more.'}],
  body:(st)=>`<div class="stage-row">${sceneHash(st)}</div>
    ${st>=2?sql(`CREATE INDEX ON sessions USING HASH (session_token);
-- equality only: WHERE session_token = 'a9f3c...'`):''}` },

{ id:'gin', kick:'how it works · GIN · inverted index', eyebrow:'One entry per value, pointing to rows', title:'GIN',
  tag:'index', steps:[
  {note:'A table normally stores row to values: row 88 has the tags sale and new.'},
  {note:'An inverted index flips it: value to the rows that contain it — like the index of a book. Built for many values per row: arrays, jsonb, full-text tsvector.'},
  {note:'A search for one element jumps straight to that value\'s posting list. Tags contains sale: read one list — rows 12, 88 and 140.'}],
  body:(st)=>`<div class="stage-row">${sceneGin(st)}</div>
    ${st>=2?sql(`CREATE INDEX ON products USING GIN (tags);   -- WHERE tags @> '{sale}'`):''}` },

{ id:'gist', kick:'how it works · GiST', eyebrow:'A tree of bounding boxes', title:'GiST',
  tag:'index', steps:[
  {note:'A balanced tree where each node stores a predicate — a bounding box — that contains all of its children.'},
  {note:'Search descends only into boxes that could match. You are inside box B, so all of A — and everything under it — is pruned at once.'},
  {note:'Then B1. It handles overlap, containment and nearest-neighbour: maps and GPS, range types, the "closest to me" query.'}],
  body:(st)=>`<div class="stage-row">${sceneGist(st)}</div>
    ${st>=2?sql(`CREATE INDEX ON stores USING GIST (location);
-- ORDER BY location <-> point(72.8, 19.0) LIMIT 5`):''}` },

{ id:'brin', kick:'how it works · BRIN · block range index', eyebrow:'A min/max summary per block range', title:'BRIN',
  tag:'index', steps:[
  {note:'BRIN stores only the minimum and maximum for each range of physical blocks. Our query wants created_at from November first.'},
  {note:'Blocks 1 to 64 hold September. The max is below November — skip.'},
  {note:'Blocks 65 to 128 hold October — skip.'},
  {note:'Blocks 129 to 192 hold November — scan. The whole index is tiny, often kilobytes for a multi-gigabyte table. The catch: it only works when the physical order correlates with the column — append-only, naturally ordered time series.'}],
  body:(st)=>`<div class="stage-row">${sceneBrin(st)}</div>
    ${st>=3?`${tell('Only when','physical order correlates with the column &mdash; append-only, naturally-ordered time-series.','warn')}
      ${sql(`CREATE INDEX ON events USING BRIN (created_at);   -- huge append-only log, ordered by time`)}`:''}` },

{ id:'composite', kick:'5.1 · composite indexes', eyebrow:'Two columns, one index', title:'The leftmost-prefix rule',
  tag:'index', steps:[
  {note:'A composite index on customer_id, then order_date. Think of a phone book: sorted by surname, then first name.'},
  {note:'WHERE customer_id = 1024 — uses it. All of 1024\'s entries sit together.'},
  {note:'customer_id = 1024 AND order_date after November first — uses it. A slice of that same block.'},
  {note:'order_date alone skips the leftmost column. The matching dates are scattered across every customer — like finding everyone named Riya in a phone book sorted by surname. The planner cannot seek into it; at best it reads the whole index when that is cheaper than the table — in the live run, 45 milliseconds instead of 13 with the columns the right way round. And PostgreSQL 18 adds skip scan, which helps only when the leading column has few distinct values. The rule for column order: equality columns first, range and sort columns last.'}],
  body:(st)=>`${sql(`CREATE INDEX ON orders (customer_id, order_date);`,'lg')}
    <div class="stage-row">${sceneComposite(st)}</div>
    ${st>=3?tell('Column order','equality columns first, range / sort columns last. Without the leading column the index can be read whole, never <b>sought</b> (PG 18 skip scan helps only when the leading column has few values).','note'):''}` },

{ id:'shapes', kick:'5.1 · special shapes', eyebrow:'Four shapes worth knowing', title:'Unique, partial, expression, covering',
  tag:'index', steps:[
  {note:'Unique: enforces uniqueness and speeds lookups — an email column, for example.'},
  {note:'Partial: indexes only the rows that match a condition. Only pending orders — smaller and faster.'},
  {note:'Expression: indexes an expression. This is the fix for the LOWER trap from trick 2.'},
  {note:'Covering, with INCLUDE: carries extra columns in the index so the query is answered from the index alone — an Index Only Scan.'}],
  body:(st)=>{
    const S = [['Unique','Enforces uniqueness & speeds lookups — e.g. email.',`CREATE UNIQUE INDEX ON customers (email);`,'tl'],
               ['Partial','Indexes only rows matching a condition — smaller & faster.',`CREATE INDEX ON orders (order_date)
WHERE status = 'pending';`,'pp'],
               ['Expression','Indexes an expression — fixes the LOWER() trap.',`CREATE INDEX ON customers (LOWER(email));`,'good'],
               ['Covering (INCLUDE)','Carries extra columns so the query is answered from the index alone → Index-Only Scan.',`CREATE INDEX ON orders (customer_id)
INCLUDE (total_amount);`,'good']];
    return `<div class="cards" style="grid-template-columns:1fr 1fr">
      ${S.map((s,i)=> st>=i ? `<div class="pop"><div class="card ${s[3]}"><h4>Shape ${i+1}</h4><h3>${s[0]}</h3><p>${s[1]}</p>
        <div style="margin-top:.35rem">${sql(s[2],'sm')}</div></div></div>`:'').join('')}</div>`; } },

{ id:'whenidx', kick:'5.2 · when to use them', eyebrow:'Index these', title:'— and verify the plan',
  tag:'index', steps:[
  {note:'A selective WHERE filter — one that returns a small fraction of the table. Selectivity is everything: status, where 95 percent is delivered, is nearly useless; email, which is unique, is ideal.'},
  {note:'Join keys — foreign keys like orders.customer_id and order_items.order_id. A very common miss: PostgreSQL does not index foreign keys for you.'},
  {note:'ORDER BY and GROUP BY columns — an index supplies pre-sorted rows and deletes a Sort node.'},
  {note:'And always verify. After creating it, re-run EXPLAIN. The node should change to an Index, Index Only or Bitmap scan and the time should drop — or the planner correctly ignored it.'}],
  body:(st)=>`<div class="cards" style="grid-template-columns:repeat(3,minmax(0,1fr))">
      <div class="pop">${card('Selective WHERE','Small fraction','Selectivity is everything: <code>status</code> (95% delivered) is nearly useless; <code>email</code> (unique) is ideal.','good',ico('search'))}</div>
      ${st>=1?`<div class="pop">${card('Join keys','Foreign keys','<code>orders.customer_id</code>, <code>order_items.order_id</code>. A very common miss.','tl',ico('route'))}</div>`:''}
      ${st>=2?`<div class="pop">${card('ORDER BY / GROUP BY','Pre-sorted rows','An index supplies rows already in order and deletes a Sort node.','pp',ico('layers'))}</div>`:''}
    </div>
    ${st>=3?tell('Always verify','after creating, <b>re-EXPLAIN</b>. The node should change to Index / Index-Only / Bitmap Scan and time should drop &mdash; or the planner correctly ignored it.','note'):''}` },

{ id:'cost', kick:'5.2 · evaluate the cost', eyebrow:'Indexes are not free', title:'Index for your reads, pay on every write',
  tag:'index', steps:[
  {note:'Every INSERT, UPDATE and DELETE must also update every index on the table — so writes get slower.'},
  {note:'Here one row written means five structures updated. Indexes also consume disk and RAM cache, and redundant or unused ones are pure overhead.'},
  {note:'Rule of thumb: index the columns you filter and join on constantly — not every column just in case.'},
  {note:'Mini-checkpoint. An index on status, with four evenly spread values, still shows a Seq Scan. Bug, or correct?'},
  {note:'Correct. Low selectivity — reading a quarter of the table through an index is slower than just scanning it. If one status is rare, consider a partial index.'}],
  body:(st)=>`<div class="stage-row">${sceneWriteCost(st)}</div>
    ${st>=1?`<div class="cards pop" style="grid-template-columns:1fr 1fr">
      ${card('Cost','Slower writes','Every <code>INSERT</code> / <code>UPDATE</code> / <code>DELETE</code> must also update the index.','warn')}
      ${card('Cost','Disk & RAM','Redundant / unused indexes are pure overhead.','warn')}</div>`:''}
    ${st>=2?tell('Rule of thumb','index the columns you filter and join on constantly &mdash; not every column just in case.','note'):''}
    ${st>=3?tell('Mini-check','index on <code>status</code> (4 even values) still shows Seq Scan &mdash; bug or correct?'+(st>=4?' &rarr; <b>correct</b>: low selectivity. Consider a partial index if one status is rare.':''),st>=4?'':'warn'):''}` },

{ id:'syntax', kick:'5.3 · how to create', eyebrow:'The syntax menu', title:'Six ways to write CREATE INDEX',
  tag:'index', steps:[
  {note:'Basic single column.'},
  {note:'Composite: equality column first, range or sort column last.'},
  {note:'Partial: only the pending orders.'},
  {note:'Expression: fixes the LOWER trap.'},
  {note:'Covering: enables the Index Only Scan.'},
  {note:'And in production: build it CONCURRENTLY, so the table is not locked against writes while the index builds.'}],
  body:(st)=>{
    const B = [`-- basic single column
CREATE INDEX idx_orders_customer ON orders (customer_id);`,
`-- composite: equality col first, range/sort col last
CREATE INDEX idx_orders_cust_date ON orders (customer_id, order_date);`,
`-- partial
CREATE INDEX idx_orders_pending ON orders (order_date) WHERE status = 'pending';`,
`-- expression (fixes the LOWER() trap)
CREATE INDEX idx_cust_lower_email ON customers (LOWER(email));`,
`-- covering → enables Index-Only Scan
CREATE INDEX idx_orders_cust_incl ON orders (customer_id) INCLUDE (total_amount);`,
`-- PRODUCTION: build without locking writes
CREATE INDEX [[CONCURRENTLY]] idx_orders_customer ON orders (customer_id);`];
    return `<div class="stack">${B.map((b,i)=> st>=i ? `<div class="pop">${sql(b)}</div>`:'').join('')}</div>`; } },

{ id:'which', kick:'5.4 · which index to pick', eyebrow:'The query pattern picks the index', title:'And the trap most people miss',
  tag:'index', steps:[
  {note:'Equality or range on one column: a plain B-tree.'},
  {note:'Filter plus join, or filter plus sort together: composite, equality column first, range or sort column last.'},
  {note:'Only a slice is ever queried: partial.'},
  {note:'WHERE wraps the column in a function: a functional, or expression, index — a plain index is skipped.'},
  {note:'Here is that trap. A plain index on email, query on LOWER(email): Seq Scan, 1,980 milliseconds — the index on email is not usable.'},
  {note:'Create the index on the expression itself, and it becomes an Index Scan: 1.8 milliseconds.'}],
  body:(st)=>{
    const P = [['Equality / range on one column','plain B-tree','WHERE customer_id = 42'],
               ['Filter + join, or filter + sort','composite — equality first, range/sort last',''],
               ['Only a slice is ever queried','partial',"WHERE status = 'pending'"],
               ['WHERE wraps the column in a function','functional (expression) index','a plain index is skipped']];
    if(st < 4) return `<div class="rows" style="--cols:1.2fr 1fr .9fr">
      ${P.map((p,i)=> st>=i ? `<div class="row pop"><span>${p[0]}</span><b style="font-size:.85rem">&rarr; ${p[1]}</b><span class="ex">${p[2]}</span></div>`:'').join('')}</div>`;
    return `<div class="pair">
      <div class="pop"><span class="verdict bad">&#10005; Without — plain index on email</span>${sql(`SELECT * FROM customers
WHERE [[!LOWER(email)]] = 'sam@shop.io';`)}
        <div class="stat warn" style="margin-top:.4rem"><div class="k">Seq Scan on customers</div><div class="v">1,980 ms</div><div class="s">index on email not usable</div></div></div>
      ${st>=5?`<div class="pop"><span class="verdict good">&check; With — functional index on the expression</span>${sql(`CREATE INDEX idx_cust_lower_email
  ON customers ([[LOWER(email)]]);`)}
        <div class="stat good" style="margin-top:.4rem"><div class="k">Index Scan using idx_cust_lower_email</div><div class="v">1.8 ms</div><div class="s">same query, untouched</div></div></div>`:'<div></div>'}
    </div>`; } },

{ id:'victory', kick:'the victory lap', eyebrow:'Kill the Seq Scan', title:'Same data. Same result.',
  tag:'payoff', steps:[
  {note:'The query this index is built for: Aarav\'s orders this month — customer 1024, from the first of the month. One index, built concurrently: customer_id, then order_date, including total_amount. Equality first, range second, and the amount carried along so the table is never touched.'},
  {note:'Before: Seq Scan on orders — all twenty million rows read to return Aarav\'s handful. 2,140 milliseconds. After: Index Only Scan using our new index — 3.2 milliseconds.'},
  {note:'Same data. Same result. We changed the route, not the destination. 2,140 milliseconds to 3.'},
  {note:'One honest footnote: this index serves this query, not every query. The orders-over-five-thousand filter from the before picture needs its own index on total_amount, and the all-customers dashboard filters on order_date alone, so it needs order_date first. Each query gets the index its WHERE clause asks for.'}],
  body:(st)=>`${sql(`SELECT order_date, total_amount FROM orders
WHERE [[customer_id = 1024]] AND [[order_date >= date_trunc('month', CURRENT_DATE)]];

CREATE INDEX CONCURRENTLY idx_orders_cust_date_amt
  ON orders ([[customer_id, order_date]]) [[INCLUDE (total_amount)]];`,'sm')}
    <div class="stage-row">${sceneVictory(st>=1?(st>=2?2:1):0)}</div>
    <div class="stats" style="--n:2">
      <div class="stat warn"><div class="k">Before</div><div class="v" style="font-size:1.25rem">Seq Scan on orders</div><div class="s">all 20M rows read for Aarav's handful &middot; 2,140 ms</div></div>
      ${st>=1?`<div class="stat good pop"><div class="k">After</div><div class="v" style="font-size:1.25rem">Index Only Scan using idx_orders_cust_date_amt</div><div class="s">3.2 ms</div></div>`:'<div></div>'}
    </div>
    ${st===2?`<p class="quote pop">Same data. Same result. We changed the route, not the destination.</p>`:''}
    ${st>=3?tell('One index per WHERE','<code>total_amount &gt; 5000</code> needs <code>(total_amount)</code>; the all-customers dashboard needs <code>(order_date) INCLUDE (customer_id, total_amount)</code>. This index serves the drill-down.','note'):''}` },

{ id:'quiz5', kick:'checkpoint · segment 5', eyebrow:'Check yourself', title:'Rapid fire',
  tag:'checkpoint', steps:quizSteps(Q5), body:(st)=>quiz(Q5, st, 2) },

/* ================= 7 · wrap-up ================= */
{ id:'workflow', kick:'your reusable framework', eyebrow:'Wrap-up', title:'The optimization workflow',
  tag:'recap', steps:[
  {note:'Measure — EXPLAIN ANALYZE. Find the slowest node and the headline time.'},
  {note:'Read — spot the Seq Scan, the Rows Removed, the estimate-actual gap, the disk sort.'},
  {note:'Rewrite, free fixes first — prune columns, keep filters sargable, kill correlated subqueries, refresh statistics.'},
  {note:'Restructure — CTEs for clarity, and to compute expensive things once.'},
  {note:'Index — last, and deliberate. Pick the type, order the columns right, verify, and mind the write cost.'},
  {note:'Re-measure — confirm the win. Never trust a fix you did not re-plan. And then, if it is still slow, back to step one.'}],
  body:(st)=>{
    const W = [['Measure','<code>EXPLAIN ANALYZE</code>; find the slowest node & the headline time.','gauge'],
               ['Read','spot the Seq Scan, Rows Removed, the estimate/actual gap, the disk sort.','search'],
               ['Rewrite','free fixes first — prune columns, keep filters sargable, kill correlated subqueries, refresh stats.','bolt'],
               ['Restructure','CTEs for clarity and to compute expensive things once.','layers'],
               ['Index','last, deliberate — pick the type, order columns right, verify, mind the write cost.','build'],
               ['Re-measure','confirm the win; never trust a fix you didn\'t re-plan.','clock']];
    return `<div class="cards" style="grid-template-columns:repeat(3,minmax(0,1fr))">
      ${W.map((w,i)=> st>=i ? `<div class="pop">${card('Step '+(i+1),w[0],w[1],i===4?'pp':i===5?'good':'tl',ico(w[2]))}</div>`:'').join('')}</div>
      ${st>=5?`<p class="lede pop" style="text-align:center">&#8635; still slow? back to step 1.</p>`:''}`; } },

{ id:'homework', kick:'bridge to next lecture', eyebrow:'Homework & what\'s next', title:'Bring me a plan',
  tag:'close', steps:[
  {note:'The assignment: a slow order_items report query and its schema. Bring the EXPLAIN ANALYZE from before and after, and the index you chose — and justify the column order.'},
  {note:'Next: the layers we deliberately skipped today — partitioning, and configuration tuning like work_mem. The schema and hardware levels.'},
  {note:'And the line to leave them with. You did not make the database faster. You stopped making it do unnecessary work — and then you gave it a shortcut. That is query optimization.'}],
  body:(st)=>`<div class="cards" style="grid-template-columns:1fr 1fr">
      <div class="pop">${card('Your assignment','A slow order_items report','Bring its <code>EXPLAIN ANALYZE</code> before/after and the index you chose &mdash; <b>justify the column order</b>.','pp',ico('search'))}</div>
      ${st>=1?`<div class="pop">${card('Next','The layers we skipped','Partitioning and configuration tuning (<code>work_mem</code>) &mdash; the schema and hardware levels we set aside today.','tl',ico('layers'))}</div>`:''}
    </div>
    ${st>=2?`<p class="quote pop">"You didn't make the database faster. You stopped making it do unnecessary work &mdash; and then you gave it a shortcut. That's query optimization."</p>`:''}` },

{ id:'thanks', kick:'questions welcome', eyebrow:'Thank you', title:'Thanks — and over to you.',
  tag:'close', steps:[
  {note:'Thank them, point at the feedback form, and open the floor. Invite them to bring the plan they are stuck on — we will read it together.'}],
  body:(st)=>`<div class="hero">
    <div class="big">Over to <em>you</em>.</div>
    <div class="sub">Please fill the feedback form. Questions welcome &mdash; bring the plan you're stuck on and we'll read it together.</div>
    <div class="race" style="font-size:1.5rem"><span class="from">2,140 ms</span><span class="arr">&rarr;</span><span class="to">3.2 ms</span></div>
    <div class="sub" style="font-size:.78rem">Every query, run live with its real plan:
      <a href="live/" style="color:var(--pencil-2)">edusatyaki.github.io/Query-Level-Optimization/live</a></div>
  </div>` }
];

</script>
<script>
/* ---- assemble the running order: a chapter opener, then that chapter's slides ---- */
const BY_ID = Object.fromEntries(DECK.map(d => [d.id, d]));
const RUN = [];
CHAPTERS.forEach(ch => {
  if(OPENERS[ch.n]) RUN.push({
    id:'ch'+ch.n, chapter:ch, type:'chapter',
    eyebrow:'Chapter '+ch.n, title:ch.t, kick:OPENERS[ch.n].when, tag:'story',
    steps:[
      {note:'Chapter card. Pause here — this is where the story turns. Read the situation, then let them feel the problem before you name the technique.'},
      {note:OPENERS[ch.n].problem},
      {note:OPENERS[ch.n].detail},
      {note:OPENERS[ch.n].next}
    ],
    body:(st)=>chapterBody(ch, st)
  });
  ch.of.forEach(id => { const d = BY_ID[id]; if(d){ d.chapter = ch; RUN.push(d); } });
});
DECK.length = 0;
RUN.forEach(d => DECK.push(d));

/* ===================== presenter engine ===================== */
const $ = s => document.querySelector(s);
const stage = $('#stage');
let si = 0, pi = 0, lastSlide = null;

function render(){
  const sl = DECK[si];
  pi = Math.max(0, Math.min(pi, sl.steps.length - 1));
  const entering = lastSlide !== sl.id;
  lastSlide = sl.id;
  stage.innerHTML = `<div class="slide"${entering?' data-entering="1"':''}>`
                  + `<div class="fit">${sl.body(pi)}</div></div>`;
  $('#sTitle').textContent   = sl.title;
  $('#sEyebrow').textContent = sl.eyebrow;
  $('#sKick').textContent    = sl.kick || '';
  railState(sl);
  $('#noteSay').innerHTML = sl.steps[pi].note || '—';
  $('#noteNxt').textContent = pi+1 < sl.steps.length
    ? `next → step ${pi+2} of this slide`
    : (si+1 < DECK.length ? `next → ${DECK[si+1].title}` : 'end of deck');
  const done = DECK.slice(0, si).reduce((n,d)=>n+d.steps.length, 0) + pi + 1;
  const all  = DECK.reduce((n,d)=>n+d.steps.length, 0);
  /* every step is its own page: the counter runs 1 … all across the whole deck */
  $('#stepCount').textContent = `page ${done} / ${all}`;
  $('#progFill').style.width = (done/all*100).toFixed(2) + '%';
  fitSlide();
}

/* Scale the current step down if it would not fit, so a slide is never
   scrollable and never clipped. Entrance animations start elements translated,
   so the first measurement can read short — re-measure once the frame has laid
   out and again once the longest entrance has finished. */
let fitTimer = null;
function fitSlide(){
  const slide = stage.querySelector('.slide'), fit = stage.querySelector('.fit');
  if(!slide || !fit) return;
  const measure = () => {
    if(!fit.isConnected) return;
    fit.style.transform = '';
    /* A centred box splits its overflow above AND below, and scrollHeight only
       counts what hangs below — so a centred measurement under-reports the true
       need by about half. This applies at every nesting level, not just the
       outer column, so flatten them all for the measurement. */
    fit.classList.add('measuring');
    const avail = fit.clientHeight;
    let need = fit.scrollHeight;
    fit.querySelectorAll('*').forEach(el => {        // catch anything still spilling
      const h = el.scrollHeight;
      if(h > need && el.parentElement === fit) need = h;
    });
    fit.classList.remove('measuring');
    if(need > avail + 1){
      /* Centred content that overflows puts half of itself ABOVE the box, which
         a top-origin scale cannot pull back. Anchor to the top before scaling. */
      fit.classList.add('topfit');
      /* the sketch rotations make visual boxes a few px taller than their
         layout boxes, which scrollHeight cannot see — leave room for it */
      const k = Math.max(0.42, (avail - 12) / need);
      fit.style.transform = `scale(${k.toFixed(4)})`;
    } else {
      fit.classList.remove('topfit');
    }
  };
  measure();
  requestAnimationFrame(measure);
  clearTimeout(fitTimer);
  fitTimer = setTimeout(measure, 520);                  // after the last .pop lands
}
window.addEventListener('resize', fitSlide);
if(window.ResizeObserver) new ResizeObserver(fitSlide).observe(document.querySelector('#app'));
/* the rail is the table of contents: click a chapter to jump to its first slide */
$('#railNav').innerHTML = CHAPTERS.map(ch =>
  `<div class="rn" data-ch="${ch.n}">
     <span class="rn-n">${String(ch.n).padStart(2,'0')}</span>
     <span class="rn-t">${ch.t}</span></div>`).join('');
$('#railNav').querySelectorAll('.rn').forEach(el => el.onclick = () => {
  const n = +el.dataset.ch;
  const at = DECK.findIndex(d => d.chapter && d.chapter.n === n);
  if(at >= 0){ si = at; pi = 0; render(); }
});
function railState(sl){
  const cur = sl.chapter ? sl.chapter.n : 0;
  const nav = $('#railNav');
  let now = null;
  nav.querySelectorAll('.rn').forEach(el => {
    const n = +el.dataset.ch;
    el.classList.toggle('now',  n === cur);
    el.classList.toggle('done', n <  cur);
    if(n === cur) now = el;
  });
  // if the list is scrolling, keep the chapter we are in on screen
  if(railScrolls() && now){
    now.scrollIntoView({block:'nearest', behavior: REDUCED ? 'auto' : 'smooth'});
  }
}
function railScrolls(){
  const nav = $('#railNav');
  const over = nav.scrollHeight > nav.clientHeight + 1;
  nav.classList.toggle('scrolls', over);
  return over;
}
window.addEventListener('resize', railScrolls);

/* ---- navigation: right / left arrow drive the whole deck ---- */
function next(){
  const s = DECK[si];
  if(pi < s.steps.length-1) pi++;
  else if(si < DECK.length-1){ si++; pi = 0; }
  else return;
  render();
}
function prev(){
  if(pi > 0) pi--;
  else if(si > 0){ si--; pi = DECK[si].steps.length-1; }
  else return;
  render();
}
function jump(d){ const n = si+d; if(n<0||n>=DECK.length) return; si=n; pi=0; render(); }

/* ---- presenter zoom: type is a share of screen height, this multiplies it ---- */
const ZMIN=.6, ZMAX=2.0, ZSTEP=.08;
let zoom = 1;
try { zoom = parseFloat(localStorage.getItem('qopt-zoom')) || 1; } catch(e){}
function applyZoom(show){
  zoom = Math.min(ZMAX, Math.max(ZMIN, zoom));
  document.documentElement.style.setProperty('--scale', zoom.toFixed(3));
  try { localStorage.setItem('qopt-zoom', zoom); } catch(e){}
  if(show){
    const px = parseFloat(getComputedStyle(document.documentElement).fontSize);
    const z = $('#zoom');
    z.innerHTML = Math.round(zoom*100) + '%<small>body text &asymp; ' + Math.round(px*.72) + 'px · 0 resets</small>';
    z.classList.add('show');
    clearTimeout(z._t); z._t = setTimeout(()=>z.classList.remove('show'), 1100);
  }
  fitSlide();
}
applyZoom(false);

/* ---- theme: light matches the lecture deck, dark reads better in a dim hall ---- */
function applyTheme(t, show){
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('qopt-theme', t); } catch(e){}
  if(show){
    const z = $('#zoom');
    z.innerHTML = (t === 'dark' ? 'Dark' : 'Light') + '<small>press T to switch</small>';
    z.classList.add('show');
    clearTimeout(z._t); z._t = setTimeout(()=>z.classList.remove('show'), 900);
  }
}
let theme = 'light';
try { theme = localStorage.getItem('qopt-theme') || 'light'; } catch(e){}
applyTheme(theme, false);

document.addEventListener('keydown', e=>{
  if($('#ov').classList.contains('open') && !['o','O','Escape'].includes(e.key)) return;
  switch(e.key){
    case 'ArrowRight': case ' ': case 'PageDown': e.preventDefault(); next(); break;
    case 'ArrowLeft':  case 'PageUp':            e.preventDefault(); prev(); break;
    case 'ArrowDown':  e.preventDefault(); jump(1);  break;
    case 'ArrowUp':    e.preventDefault(); jump(-1); break;
    case 'Home': si=0; pi=0; render(); break;
    case 'End':  si=DECK.length-1; pi=DECK[si].steps.length-1; render(); break;
    case 'f': case 'F': e.preventDefault(); toggleFull(); break;
    case 's': case 'S': $('#notes').classList.toggle('open'); break;
    case 'o': case 'O': $('#ov').classList.toggle('open'); break;
    case 't': case 'T':
      theme = theme === 'dark' ? 'light' : 'dark'; applyTheme(theme, true); break;
    case 'r': case 'R': pi = 0; render(); break;
    case 'Escape': $('#ov').classList.remove('open'); $('#notes').classList.remove('open'); break;
    case '+': case '=': e.preventDefault(); zoom += ZSTEP; applyZoom(true); break;
    case '-': case '_': e.preventDefault(); zoom -= ZSTEP; applyZoom(true); break;
    case '0': e.preventDefault(); zoom = 1; applyZoom(true); break;
  }
});
stage.addEventListener('click', () => next());

/* ---- full screen: a visible control, since F is only in the footer legend ---- */
function toggleFull(){
  document.fullscreenElement ? document.exitFullscreen()
                             : document.documentElement.requestFullscreen().catch(()=>{});
}
$('#btnFull').addEventListener('click', e => { e.stopPropagation(); toggleFull(); });
document.addEventListener('fullscreenchange', () => {
  $('#btnFullTxt').textContent = document.fullscreenElement ? 'Exit' : 'Present';
});

/* ---- run of show ---- */
$('#ovGrid').innerHTML = DECK.map((s,i)=>
  `<div class="ovc${s.type==='chapter'?' ovc-ch':''}" data-i="${i}">
     <div class="i">${s.chapter ? 'CH '+s.chapter.n : ''} · ${s.tag}</div>
     <div class="t">${s.title}</div></div>`).join('');
$('#ovGrid').querySelectorAll('.ovc').forEach(el =>
  el.onclick = () => { si=+el.dataset.i; pi=0; $('#ov').classList.remove('open'); render(); });

/* ---- elapsed timer ---- */
const t0 = Date.now();
setInterval(()=>{
  const s = Math.floor((Date.now()-t0)/1000);
  $('#clock').textContent = String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}, 1000);

render();
</script>
</body>
</html>
