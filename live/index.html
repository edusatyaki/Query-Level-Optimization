<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Query Optimization Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Type is a share of SCREEN HEIGHT so the deck keeps its physical size on any
     projector resolution. --scale is the presenter's live zoom (+ / - / 0).   */
  --scale:1;

  /* Sketchnote palette: cream paper, ink, highlighter, pencil-blue */
  --paper:#FBF3E4;
  --paper-2:#F5EAD6;
  --card:#FFFFFF;
  --ink:#1C1A17;
  --ink-2:#403B34;
  --muted:#6B6259;
  --line:#D8CCB4;

  --amber:#FFD766;          /* highlighter */
  --amber-2:#F7C948;
  --amber-soft:#FDEFC2;
  --pencil:#7FA3C9;         /* the blue-grey sketch fill */
  --pencil-2:#3D5C7E;
  --pencil-soft:#DCE8F4;
  --flame:#E8553A;          /* warnings, hot shards — a FILL colour */
  --flame-ink:#BF3419;      /* the same voice, dark enough to set as text */
  --flame-soft:#FBE2DC;
  --on-flame:#2A1109;     /* text that sits ON a flame fill, in either theme */
  --surface-blue:#3D5C7E;   /* coloured bands that keep white text in BOTH themes */
  --surface-green:#3A7A3D;
  --leaf:#3A7A3D;           /* good, benefits */
  --leaf-soft:#E2F0E2;

  --bg:var(--paper);
  --bg-2:var(--paper-2);
  --panel:var(--card);
  --panel-2:var(--paper-2);

  /* names the rest of the stylesheet and the scene code already speak */
  --squid:var(--ink);
  --squid-2:var(--pencil-2);
  --squid-deep:#12100E;
  --orange:var(--amber);
  --orange-deep:#6E4A05;
  --orange-soft:var(--amber-soft);
  --link:var(--pencil-2);
  --link-soft:var(--pencil-soft);
  --red:var(--flame);
  --red-soft:var(--flame-soft);
  --green:var(--leaf);
  --green-soft:var(--leaf-soft);
  --white:var(--card);
  --line-2:#E7DEC9;
  --accent:var(--pencil-2);
  --accent-deep:var(--ink);
  --accent-soft:var(--line);
  --accent-tint:var(--amber-soft);
  --violet:var(--pencil-2);
  --violet-soft:var(--pencil-soft);
  --teal:var(--pencil);
  --clay:var(--flame);
  --ok:var(--leaf);
  --navy-900:var(--ink);
  --navy-800:var(--ink);
  --navy-700:var(--ink);
  --blue:var(--pencil-2);
  --blue-400:var(--ink);
  --blue-300:var(--pencil);
  --cyan:var(--amber);
  --purple:var(--pencil-2);
  --purple-300:var(--amber);
  --gold:var(--amber);
  --gold-soft:var(--amber-soft);

  --shadow:3px 4px 0 rgba(28,26,23,.13);
  --shadow-sm:2px 3px 0 rgba(28,26,23,.11);

  /* hand-drawn box: uneven corner radii, the classic sketch trick */
  --wobble:255px 15px 225px 15px/15px 225px 15px 255px;
  --wobble-2:15px 225px 15px 255px/225px 15px 255px 15px;

  --hand:'Patrick Hand','Comic Sans MS',cursive;
  --marker:'Caveat','Patrick Hand',cursive;
  --arial:var(--hand);
  --serif:var(--marker);
  --news:var(--hand);
  --sans:var(--hand);
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  /* accents re-lit for a dark ground — the light-theme values are far too dark here */
  --amber:#6B5416;
  --amber-2:#7A5D14;
  --pencil-2:#B8D4F0;
  --flame-ink:#FF8A6E;
  --leaf:#6FBF73;
  --orange-deep:#F2D07A;
  --paper:#241F1A;
  --paper-2:#2C261F;
  --card:#2B251E;
  --ink:#F6EEDF;
  --ink-2:#DACFBC;
  --muted:#9E9382;
  --line:#4A4136;
  --line-2:#3C342B;
  --amber-soft:#463A1C;
  --pencil-soft:#26323E;
  --flame-soft:#3E241E;
  --leaf-soft:#22331F;
  --white:var(--card);
  --squid-deep:#0E0C0A;
  --shadow:3px 4px 0 rgba(0,0,0,.45);
  --shadow-sm:2px 3px 0 rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{height:100dvh}
html{font-size:clamp(14px, calc(min(3.5vh, 2.08vw) * var(--scale)), 56px)}
body{
  margin:0;color:var(--ink);overflow:hidden;
  background:var(--paper);
  background-image:
    radial-gradient(circle at 22% 18%, rgba(255,215,102,.16), transparent 42%),
    radial-gradient(circle at 82% 78%, rgba(127,163,201,.13), transparent 46%);
  font-family:var(--sans);overflow:hidden;
}

/* ================= shell: chapter rail + document =================
   Flat and rule-based rather than floating cards: square corners, hairline
   borders, no shadows. The rail carries identity and position so the stage
   gets the full height of the screen.                                      */
#app{height:100%;max-width:100%;display:grid;
  grid-template-columns:clamp(8.2rem,12.5vw,12.5rem) minmax(0,1fr);
  grid-template-rows:minmax(0,1fr);overflow:hidden}

.rail{background:transparent;color:var(--ink);display:flex;flex-direction:column;
  padding:.9rem .85rem;gap:.7rem;border-right:3px dashed var(--line);
  min-width:0;min-height:0;overflow:hidden}
.rail-lecture{font-family:var(--hand);font-size:.5rem;font-weight:400;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--orange-deep);padding-bottom:.7rem;
  border-bottom:2px dashed var(--line)}
.rail-lecture b{display:block;margin-top:.15rem;font-family:var(--marker);font-weight:700;
  font-size:1.05rem;letter-spacing:0;text-transform:none;color:var(--ink);line-height:1.05}

/* the chapter list scrolls rather than clipping — at a large type scale, or on a
   short screen, it can outgrow the margin. `safe center` keeps it centred while it
   fits but falls back to start when it overflows, so the first item stays reachable. */
.rail-nav{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  justify-content:safe center;gap:.08rem;overflow-y:auto;overflow-x:hidden;
  overscroll-behavior:contain;scrollbar-width:none}
.rail-nav::-webkit-scrollbar{width:0;height:0}
/* only when it actually scrolls: fade the cut edges so a half-shown chapter
   reads as "there is more above/below" rather than as a clipping bug */
.rail-nav.scrolls{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 14px,
  #000 calc(100% - 14px),transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 14px,
  #000 calc(100% - 14px),transparent 100%)}
.rn{display:grid;grid-template-columns:1.35rem 1fr;gap:.4rem;align-items:baseline;
  padding:clamp(.16rem,.72vh,.3rem) .25rem;cursor:pointer;border-left:3px solid transparent;
  color:var(--muted);transition:color .15s,border-color .15s,background .15s}
.rn:hover{color:var(--ink);background:var(--amber-soft)}
.rn-n{font-family:var(--mono);font-size:.46rem;font-weight:700;text-align:right;color:var(--orange-deep)}
.rn-t{font-family:var(--hand);font-size:.62rem;line-height:1.15}
.rn.done{color:var(--muted);opacity:.7}
.rn.now{color:var(--ink);border-left-color:transparent;background:var(--amber);
  border-radius:var(--wobble-2);box-shadow:var(--shadow-sm)}
.rn.now .rn-n{color:var(--ink)}

.rail-foot{flex:0 0 auto;display:flex;flex-direction:column;gap:.5rem;
  padding-top:.7rem;border-top:2px dashed var(--line)}
.present{display:inline-flex;align-items:center;justify-content:center;gap:.4em;cursor:pointer;
  font-family:var(--hand);font-size:.62rem;letter-spacing:.5px;padding:.34rem .6rem;
  border:2.5px solid var(--ink);border-radius:var(--wobble);background:var(--amber);
  color:var(--ink);box-shadow:var(--shadow-sm);transition:transform .12s}
.present:hover{transform:translate(-1px,-1px) rotate(-.7deg)}
.present svg{width:1.05em;height:1.05em}
.rail-meta{display:flex;justify-content:space-between;gap:.4rem;font-family:var(--mono);
  font-size:.44rem;color:var(--muted)}
.rail-keys{font-size:.48rem;line-height:1.8;color:var(--muted)}
kbd{font-family:var(--mono);font-size:.9em;background:var(--amber-soft);
  border:1.5px solid var(--line);border-radius:4px;padding:1px 4px;color:var(--ink-2)}

.doc{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;background:transparent}
.doc-head{flex:0 0 auto;min-width:0;padding:.7rem 1.35rem .55rem;
  border-bottom:3px solid var(--ink)}
.eyebrow{font-family:var(--hand);font-size:.6rem;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--orange-deep);margin-bottom:.1rem}
.slide-title{display:inline-block;margin:0;font-family:var(--marker);font-weight:700;
  font-size:2rem;line-height:1;letter-spacing:0;color:var(--ink);
  background:linear-gradient(var(--amber),var(--amber));
  background-size:100% .62em;background-position:0 .62em;background-repeat:no-repeat;
  padding:0 .18em .06em;transform:rotate(-.5deg)}
:root[data-theme="dark"] .slide-title{color:var(--ink)}
.kick{margin-top:.12rem;font-family:var(--hand);font-size:.72rem;color:var(--muted)}

main{flex:1 1 auto;min-height:0;min-width:0;padding:.65rem 1.35rem .7rem;display:flex;overflow:hidden}
.slide{flex:1 1 auto;min-height:0;min-width:0;display:flex;align-items:center;
  justify-content:center;overflow:hidden}
.fit{width:100%;height:100%;min-height:0;padding:5px 0;display:flex;flex-direction:column;gap:.38rem;
  justify-content:center;transform-origin:center top}
/* measurement pose: centred boxes hide half their overflow from scrollHeight,
   so everything is top-aligned for the instant we measure */
.fit.topfit{justify-content:flex-start}
.fit.measuring,.fit.measuring *{
  align-items:flex-start!important;align-content:flex-start!important;
  justify-content:flex-start!important}

/* a credit line, not content: capped so it stays subordinate on a big projector
   and never steals height from the chapter list */
.rail-by{flex:0 0 auto;font-family:var(--hand);font-size:clamp(8px,.44rem,12px);
  letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);
  padding-top:clamp(4px,.42rem,9px);border-top:1px dashed var(--line);
  white-space:nowrap;overflow:hidden}
.rail-by b{font-family:var(--marker);font-weight:700;font-size:clamp(11px,.6rem,15px);
  letter-spacing:.2px;text-transform:none;color:var(--ink)}

.progress{flex:0 0 auto;height:5px;background:var(--line)}
.progress span{display:block;height:100%;background:var(--amber-2);transition:width .2s ease}

@media (max-height:820px){ .rail-keys{display:none} }
@media (max-height:720px){
  .rail-lecture{padding-bottom:.5rem}
  .rail-lecture b{font-size:.56rem}
  .rn{padding:.22rem .25rem}
  .rail-foot{gap:.35rem;padding-top:.5rem}
}
@media (max-height:600px){
  .rail-lecture b{display:none}
  .rail-by{font-size:0;padding-top:.32rem}
  .rail-by b{font-size:.56rem}
  .rn-t{font-size:.46rem}
}

@media (max-width:860px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .rail{flex-direction:row;align-items:center;gap:.7rem;border-right:none;
    border-bottom:3px solid var(--orange);padding:.5rem .8rem}
  .rail-nav,.rail-keys{display:none}
  .rail-lecture{padding-bottom:0;border-bottom:none}
  .rail-foot{flex-direction:row;align-items:center;border-top:none;padding-top:0;margin-left:auto}
  .rail-by{font-size:0;padding-top:0;border-top:none}
  .rail-by b{font-size:.56rem}
  .doc-head{padding:.8rem 1rem .5rem}
  main{padding:.7rem 1rem}
}

/* ================= shared blocks ================= */
.lede{margin:0;font-family:var(--hand);font-size:.94rem;line-height:1.38;color:var(--ink-2);max-width:54rem}
.lede b{color:var(--ink);font-weight:600}
.kicker{font-family:var(--news);font-style:italic;font-size:.82rem;color:var(--violet);margin:0}
.stage-row{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
svg.scene{width:100%;height:100%;max-height:100%;overflow:visible;fill:var(--ink)}
svg.scene rect:not(.nofx),svg.scene circle:not(.packet){filter:url(#rough)}
.cards{display:grid;gap:.5rem}
/* equal-height cards within a row, without forcing the grid to fill */
.fit > .cards > .pop{display:flex}
.fit > .cards > .pop > .card{flex:1 1 auto}
.card{position:relative;background:var(--card);border:2.5px solid var(--ink);
  border-radius:var(--wobble);padding:.62rem .9rem;overflow:visible;box-shadow:var(--shadow-sm)}
.card:nth-of-type(even){border-radius:var(--wobble-2);transform:rotate(.22deg)}
.card:nth-of-type(odd){transform:rotate(-.18deg)}
.card::after{content:'';position:absolute;left:.7rem;right:.7rem;top:-2px;height:7px;
  background:var(--pencil);border-radius:99px;opacity:.85}
.card.warn::after{background:var(--flame)} .card.good::after{background:var(--leaf)}
.card.pp::after{background:var(--amber-2)} .card.tl::after{background:var(--pencil-2)}
.card h4{margin:.1rem 0 .2rem;font-family:var(--hand);font-size:.62rem;letter-spacing:1.3px;
  text-transform:uppercase;color:var(--orange-deep)}
.card.warn h4{color:var(--flame-ink)} .card.good h4{color:var(--leaf)}
.card.pp h4{color:var(--orange-deep)} .card.tl h4{color:var(--pencil-2)}
.card h3{margin:0 0 .18rem;font-family:var(--marker);font-weight:700;font-size:1.12rem;
  line-height:1.02;letter-spacing:0;color:var(--ink)}
.card p{margin:0;font-family:var(--hand);font-size:.76rem;line-height:1.34;color:var(--ink-2)}
.card:has(.ico) h3,.card:has(.ico) h4{padding-right:2.6rem}
.card .ico{position:absolute;right:.6rem;top:.55rem;width:1.9rem;height:1.9rem;
  border-radius:var(--wobble-2);display:grid;place-items:center;background:var(--amber-soft);
  border:2px solid var(--ink)}
.card .ico svg{width:1rem;height:1rem;color:var(--ink)}
.card.warn .ico svg{color:var(--flame)} .card.good .ico svg{color:var(--leaf)}
.card.pp .ico svg{color:var(--orange-deep)} .card.tl .ico svg{color:var(--pencil-2)}
code,.mono{font-family:var(--mono);font-size:.84em;background:var(--amber-soft);
  padding:1px 5px;border-radius:5px;color:var(--ink);border:1.5px solid var(--line)}
:root[data-theme="dark"] code,:root[data-theme="dark"] .mono{color:var(--orange-deep)}

.pop{opacity:0;transform:translateY(12px);animation:pop .42s cubic-bezier(.22,1,.36,1) forwards}
@keyframes pop{to{opacity:1;transform:none}}
.d1{animation-delay:.06s}.d2{animation-delay:.14s}.d3{animation-delay:.22s}
.d4{animation-delay:.3s}.d5{animation-delay:.38s}.d6{animation-delay:.46s}

/* ================= motion primitives ================= */
@keyframes drawIn{to{stroke-dashoffset:0}}
@keyframes fadeIn{to{opacity:1}}
@keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
@keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 0 rgba(27,127,212,0))}
                     50%{filter:drop-shadow(0 0 10px rgba(27,127,212,.65))}}
@keyframes hotPulse{0%,100%{filter:drop-shadow(0 0 2px rgba(232,85,45,.35))}
                    50%{filter:drop-shadow(0 0 16px rgba(232,85,45,.85))}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes dashFlow{to{stroke-dashoffset:-36}}

.sv-draw{stroke-dasharray:var(--len,600);stroke-dashoffset:var(--len,600);
  animation:drawIn .7s ease forwards}
.sv-fade{opacity:0;animation:fadeIn .45s ease forwards}
.sv-rise{opacity:0;animation:riseIn .5s cubic-bezier(.22,1,.36,1) forwards}
.sv-pop{opacity:0;transform-box:fill-box;transform-origin:center;
  animation:popIn .45s cubic-bezier(.34,1.56,.64,1) forwards}
.sv-glow{animation:glowPulse 2.1s ease-in-out infinite}
.sv-hot{animation:hotPulse 1.3s ease-in-out infinite}
.sv-float{animation:floatY 2.6s ease-in-out infinite}
.wire{stroke:var(--ink);stroke-width:2.4;fill:none;stroke-linecap:round;filter:url(#rough2)}
.wire.live{stroke:var(--pencil-2);stroke-width:2.6;stroke-dasharray:9 9;animation:dashFlow .9s linear infinite}
/* `animation` is a shorthand, so a flowing wire that also fades in needs BOTH
   animations declared together — otherwise the flow replaces the fade and the
   line is stuck at opacity 0. */
/* packets riding the wires */
.packet{filter:drop-shadow(0 0 4px currentColor);opacity:.95}
@keyframes growUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.sv-grow{transform-box:fill-box;transform-origin:bottom;animation:growUp .75s cubic-bezier(.22,1,.36,1) forwards}
@keyframes sweepX{0%{transform:translateX(0)}100%{transform:translateX(var(--sweep,840px))}}
.sv-sweep{animation:sweepX 2.4s linear infinite}
@keyframes blip{0%,100%{opacity:.25}50%{opacity:1}}
.sv-blip{animation:blip 1.4s ease-in-out infinite}
@keyframes railPulse{0%,100%{opacity:1}50%{opacity:.55}}
.rn.now .rn-n{animation:railPulse 2.4s ease-in-out infinite}
.wire.live.sv-fade{animation:dashFlow .9s linear infinite, fadeIn .45s ease forwards}
.wire.sv-fade{animation:fadeIn .45s ease forwards}
.wire.hotwire{stroke:var(--orange)}
text{font-family:var(--hand)}
.t-lbl{font-size:17px;fill:var(--ink)}
.t-serif{font-family:var(--marker);font-weight:700;fill:var(--ink)}
.t-sub{font-size:16px;fill:var(--muted)}
.t-mono{font-family:'JetBrains Mono',monospace;font-size:14px;fill:var(--ink-2)}
.t-big{font-family:var(--marker);font-size:30px;font-weight:700;fill:var(--ink)}
.box{fill:var(--card);stroke:var(--ink);stroke-width:2.6;filter:url(#rough)}
.box-navy{fill:var(--card);stroke:var(--ink);stroke-width:2.6;filter:url(#rough)}
.box-blue{fill:var(--card);stroke:var(--ink);stroke-width:2.6;filter:url(#rough)}
.box-purple{fill:var(--amber);stroke:var(--ink);stroke-width:2.2;filter:url(#rough)}
.box-orange{fill:var(--flame);stroke:var(--ink);stroke-width:2.2;filter:url(#rough)}
.on-navy{fill:var(--ink)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
  .sv-draw{stroke-dashoffset:0}
  .sv-fade,.sv-rise,.sv-pop,.pop{opacity:1;transform:none}
}

/* ================= side-by-side explainer ================= */
.split{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);
  gap:.9rem;align-items:start}
.split-l,.split-r{min-width:0;min-height:0}
.split-l{display:flex;align-items:center;height:100%}
.lp{background:var(--card);border:2.5px solid var(--ink);border-radius:var(--wobble);
  padding:.85em 1em;box-shadow:var(--shadow-sm);transform:rotate(.22deg);
  font-size:clamp(10px,min(1.62vh,0.98vw),27px)}
.lp-head{display:flex;align-items:center;flex-wrap:wrap;gap:.45em;margin-bottom:.5em;min-width:0}
.lp-ico{flex:0 0 auto;width:2.3em;height:2.3em;border-radius:var(--wobble-2);display:grid;
  place-items:center;background:var(--amber-soft);border:2px solid var(--ink)}
.lp-ico svg{width:1.25em;height:1.25em;color:var(--ink)}
.lp-n{font-family:var(--hand);font-size:.86em;letter-spacing:1.3px;text-transform:uppercase;color:var(--orange-deep)}
.lp-t{font-family:var(--marker);font-weight:700;font-size:1.72em;line-height:.98;color:var(--ink)}
.lp-when{margin-left:auto;flex:0 0 auto;white-space:nowrap;font-size:.72em;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--ink);background:var(--amber);padding:.18em .55em;
  border:2px solid var(--ink);border-radius:var(--wobble-2)}
.lp-owns{margin:0 0 .5em;font-family:var(--hand);font-size:1.08em;line-height:1.26;color:var(--ink-2)}
.lp-row{display:grid;grid-template-columns:5.6em minmax(0,1fr);gap:.5em;padding:.3em 0;
  border-top:2px dashed var(--line)}
.lp-k{font-family:var(--hand);font-size:.86em;letter-spacing:.9px;text-transform:uppercase;
  color:var(--muted);padding-top:.12em}
.lp-row.warn .lp-k{color:var(--flame-ink)} .lp-row.good .lp-k{color:var(--green)}
.lp-v{font-family:var(--hand);font-size:1.04em;line-height:1.26;color:var(--ink-2)}
@media (max-width:980px){.split{grid-template-columns:1fr;gap:.6rem}}

/* ================= taped-in logo ================= */
.taped{position:relative;display:inline-block;background:#fff;padding:.55rem .85rem;
  border:1px solid var(--line);box-shadow:var(--shadow);transform:rotate(-1.6deg)}
.taped.r{transform:rotate(1.3deg)}
.taped::before,.taped::after{content:'';position:absolute;width:3rem;height:1rem;
  background:rgba(255,215,102,.6);border:1px solid rgba(28,26,23,.14);
  box-shadow:0 1px 2px rgba(28,26,23,.10)}
.taped::before{top:-.42rem;left:-.85rem;transform:rotate(-24deg)}
.taped::after{bottom:-.42rem;right:-.85rem;transform:rotate(-24deg)}
.taped img{display:block;height:var(--logo-h,2.4rem);width:auto}
.taped figcaption{margin-top:.25rem;font-family:var(--hand);font-size:.5rem;
  color:var(--muted);text-align:center;letter-spacing:.3px}
:root[data-theme="dark"] .taped{background:#F7F2E8;color:#1C1A17}
:root[data-theme="dark"] .taped figcaption{color:#6B6259}

/* ================= chapter opener ================= */
.chapter{flex:1 1 auto;display:flex;align-items:center;gap:2.4rem;padding:0 .6rem}
.ch-rail{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:.25rem;
  padding-right:2.2rem;border-right:4px dashed var(--amber-2)}
.ch-num{font-family:var(--marker);font-size:7rem;font-weight:700;line-height:.76;
  color:var(--ink);letter-spacing:0}
:root[data-theme="dark"] .ch-num{color:var(--ink)}
.ch-of{font-family:var(--hand);font-size:.58rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.ch-body{flex:1 1 auto;min-width:0;max-width:46rem}
.ch-when{font-family:var(--hand);font-size:.66rem;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--orange-deep);margin-bottom:.3rem}
.ch-title{display:inline-block;margin:0 0 .65rem;font-family:var(--marker);font-weight:700;
  font-size:2.6rem;line-height:.98;letter-spacing:0;color:var(--ink);transform:rotate(-.8deg);
  background:linear-gradient(var(--amber),var(--amber));background-size:100% .5em;
  background-position:0 .66em;background-repeat:no-repeat;padding:0 .14em}
:root[data-theme="dark"] .ch-title{color:var(--ink)}
.ch-problem{margin:0 0 .45rem;font-family:var(--marker);font-weight:700;font-size:1.5rem;
  line-height:1.06;color:var(--ink)}
.ch-detail{margin:0 0 .5rem;font-family:var(--hand);font-size:.92rem;line-height:1.34;color:var(--ink-2)}
.ch-next{margin:0;font-family:var(--hand);font-size:.86rem;line-height:1.3;color:var(--ink);
  border-left:4px dashed var(--amber-2);padding-left:.7rem}
@media (max-width:900px){
  .chapter{flex-direction:column;align-items:flex-start;gap:1rem}
  .ch-rail{flex-direction:row;align-items:baseline;border-right:none;
    border-bottom:4px solid var(--orange);padding:0 0 .4rem;gap:.7rem}
  .ch-num{font-size:3rem}}

/* ================= chapter chip in the masthead ================= */


/* ================= notes / overview / zoom ================= */
#notes::-webkit-scrollbar,#ov::-webkit-scrollbar{width:0;height:0}
#notes,#ov{scrollbar-width:none}
#notes{position:fixed;left:0;right:0;bottom:0;z-index:40;transform:translateY(101%);
  transition:transform .28s ease;background:#1C1A17;color:#eaf3fa;
  border-top:3px solid var(--gold);padding:14px 24px 16px;max-height:46vh;overflow-y:auto}
#notes.open{transform:none}
#notes h6{margin:0 0 6px;font-size:.5rem;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold)}
#notes .say{font-family:var(--news);font-size:.82rem;line-height:1.55;max-width:66rem}
#notes .say b{color:var(--gold);font-weight:700}
#notes .nxt{margin-top:8px;font-size:.5rem;color:#8fabc2;font-family:var(--mono)}

#ov{position:fixed;inset:0;z-index:50;background:var(--bg);padding:28px;display:none;overflow-y:auto}
#ov.open{display:block}
#ov h3{margin:0 0 16px;font-family:var(--serif);font-size:.86rem;font-weight:700;color:var(--ink);letter-spacing:0;text-transform:none}
.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:10px}
.ovc{padding:11px 13px;border-radius:0;border:1px solid var(--line);border-top:3px solid var(--line);
  cursor:pointer;background:var(--panel);transition:.15s}
.ovc:hover{border-top-color:var(--orange)}
.ovc-ch{background:var(--squid);border-color:var(--squid);border-top-color:var(--orange)}
.ovc-ch .t{color:#fff}.ovc-ch .i{color:var(--orange)}
.ovc .i{font-family:var(--mono);font-size:.45rem;color:var(--blue);font-weight:700}
.ovc .t{font-family:var(--serif);font-size:.7rem;font-weight:700;margin-top:4px;line-height:1.2}

#zoom{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);z-index:60;
  padding:.9rem 1.5rem;border-radius:0;border:2px solid var(--orange);background:var(--panel);
  color:var(--squid);font-family:var(--mono);font-size:1.5rem;font-weight:700;opacity:0;
  pointer-events:none;transition:opacity .18s,transform .18s;box-shadow:var(--shadow)}
#zoom.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#zoom small{display:block;font-size:.42em;color:var(--muted);font-weight:400;margin-top:.3rem;text-align:center}

:root:fullscreen main{padding:22px 34px}
:root:fullscreen header{padding-top:13px;padding-bottom:13px}

@media (max-width:900px){ header,main,footer{padding-left:14px;padding-right:14px} }

/* ================= query-optimization additions ================= */
.sv-spin{transform-box:fill-box;transform-origin:center;animation:spinSlow 1.1s linear infinite}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.sv-growx{transform-box:fill-box;transform-origin:left;animation:growX .9s cubic-bezier(.22,1,.36,1) forwards}
@keyframes litUp{to{fill:var(--line)}}

/* SQL on paper: mono, keyword-weighted, strings and comments set apart */
.sql{margin:0;padding:.55rem .8rem;background:var(--paper-2);color:var(--ink);
  border:2.5px solid var(--ink);border-radius:var(--wobble-2);box-shadow:var(--shadow-sm);
  font-family:var(--mono);font-size:.56rem;line-height:1.55;white-space:pre-wrap;overflow:hidden}
.sql b{color:var(--pencil-2);font-weight:700}
.sql .st{color:var(--leaf)}
.sql i{color:var(--muted);font-style:normal}
.sql mark{background:var(--amber);color:var(--ink);border-radius:3px;padding:0 2px}
.sql mark.bad{background:var(--flame-soft);outline:2px solid var(--flame);outline-offset:0}
.sql.sm{font-size:.5rem}
.sql.lg{font-size:.64rem}

/* bad vs good, side by side */
.pair{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:.6rem;align-items:stretch}
.pair > div{display:flex;flex-direction:column;gap:.25rem;min-width:0}
.pair .sql{flex:1 1 auto}
.verdict{font-family:var(--hand);font-size:.6rem;letter-spacing:1.2px;text-transform:uppercase}
.verdict.bad{color:var(--flame-ink)} .verdict.good{color:var(--leaf)}

/* a strip that names what changes in the plan */
.tell{display:flex;gap:.6rem;align-items:baseline;padding:.4rem .8rem;background:var(--leaf-soft);
  border:2.5px solid var(--ink);border-radius:var(--wobble);font-family:var(--hand);font-size:.72rem;
  color:var(--ink);box-shadow:var(--shadow-sm)}
.tell b{flex:0 0 auto;font-size:.58rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--leaf)}
.tell.warn{background:var(--flame-soft)} .tell.warn b{color:var(--flame-ink)}
.tell.note{background:var(--amber-soft)} .tell.note b{color:var(--orange-deep)}
.tell code{font-size:.8em}

/* checkpoint question + answer */
.qa{display:grid;gap:.5rem}
.q{background:var(--card);border:2.5px solid var(--ink);border-radius:var(--wobble);
  padding:.5rem .85rem;box-shadow:var(--shadow-sm)}
.q:nth-child(even){border-radius:var(--wobble-2)}
.q h3{margin:0;font-family:var(--hand);font-weight:400;font-size:.8rem;line-height:1.3;color:var(--ink)}
.q h3 span{font-family:var(--marker);font-weight:700;font-size:1.05rem;color:var(--orange-deep);margin-right:.3rem}
.q p{margin:.25rem 0 0;font-family:var(--hand);font-size:.74rem;line-height:1.3;color:var(--leaf)}
.q p.wait{color:var(--muted);opacity:.5}

/* big numbers */
.stats{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:.6rem}
.stat{background:var(--card);border:2.5px solid var(--ink);border-radius:var(--wobble);padding:.5rem .8rem;
  box-shadow:var(--shadow-sm)}
.stat .k{font-family:var(--hand);font-size:.56rem;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--marker);font-weight:700;font-size:1.9rem;line-height:1;color:var(--ink)}
.stat .s{font-family:var(--hand);font-size:.64rem;color:var(--ink-2)}
.stat.warn .v{color:var(--flame-ink)} .stat.good .v{color:var(--leaf)}

/* small data tables */
.dts{display:grid;grid-template-columns:1fr 1fr;gap:.6rem .9rem}
.dt{min-width:0}
.dt h5{margin:0 0 .15rem;font-family:var(--mono);font-size:.54rem;color:var(--orange-deep)}
.dt table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:.46rem;background:var(--card);
  border:2px solid var(--ink)}
.dt th{background:var(--amber);color:var(--ink);text-align:left;padding:.16rem .3rem;font-weight:700;
  border-bottom:2px solid var(--ink)}
.dt td{padding:.16rem .3rem;border-top:1px dashed var(--line);color:var(--ink-2);white-space:nowrap}
.dt tr.hl td{background:var(--amber-soft);color:var(--ink)}

/* a plan printed like EXPLAIN prints it */
.plan{margin:0;padding:.6rem .9rem;background:var(--paper-2);border:2.5px solid var(--ink);
  border-radius:var(--wobble-2);box-shadow:var(--shadow-sm);font-family:var(--mono);font-size:.64rem;
  line-height:1.7;color:var(--ink-2);white-space:pre-wrap}
.plan span{border-radius:4px;padding:0 3px;transition:background .2s}
.plan span.on{background:var(--amber);color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.plan .bad{color:var(--flame-ink)}
.anno{display:grid;gap:.3rem}
.anno div{font-family:var(--hand);font-size:.7rem;line-height:1.3;color:var(--ink-2);
  padding:.2rem 0 .2rem .6rem;border-left:4px dashed var(--line)}
.anno div code{font-weight:700}
.anno div.on{border-left:4px solid var(--amber-2);color:var(--ink)}
.anno div.warn{border-left-color:var(--flame)}

/* numbered rows (types, workflow) */
.rows{display:grid;gap:.35rem}
.row{display:grid;grid-template-columns:var(--cols,7rem 1fr 11rem);gap:.6rem;align-items:center;
  padding:.38rem .75rem;background:var(--card);border:2.5px solid var(--ink);border-radius:var(--wobble);
  box-shadow:var(--shadow-sm);font-family:var(--hand);font-size:.68rem;color:var(--ink-2)}
.row:nth-child(even){border-radius:var(--wobble-2)}
.row > b{font-family:var(--marker);font-size:1.02rem;color:var(--ink)}
.row .ex{font-family:var(--mono);font-size:.5rem;color:var(--orange-deep);text-align:right}
.row.hot{background:var(--amber)}
.row.hot .ex{color:var(--ink)}
.row.dim{opacity:.45}

/* the chat bubble on the scenario slide */
.chat{display:flex;gap:.6rem;align-items:flex-start}
.chat .av{flex:0 0 auto;width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;
  background:var(--pencil-2);color:var(--card);font-family:var(--marker);font-weight:700;font-size:1.1rem;
  border:2.5px solid var(--ink)}
.chat .bub{background:var(--card);border:2.5px solid var(--ink);border-radius:var(--wobble);padding:.45rem .8rem;
  box-shadow:var(--shadow-sm)}
.chat .who{font-family:var(--hand);font-size:.54rem;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.chat .msg{font-family:var(--marker);font-weight:700;font-size:1.3rem;line-height:1.05;color:var(--ink)}

/* the title slide */
.hero{display:flex;flex-direction:column;align-items:flex-start;gap:.7rem;padding:0 .4rem}
.hero .big{font-family:var(--marker);font-weight:700;font-size:3.4rem;line-height:.95;color:var(--ink)}
.hero .big em{font-style:normal;background:linear-gradient(var(--amber),var(--amber));background-size:100% .45em;
  background-position:0 .7em;background-repeat:no-repeat;padding:0 .1em}
.hero .sub{font-family:var(--hand);font-size:1rem;color:var(--ink-2);max-width:40rem}
.hero .by{font-family:var(--hand);font-size:.7rem;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.hero .by b{font-family:var(--marker);font-size:1.15rem;letter-spacing:0;text-transform:none;color:var(--ink)}
.race{display:flex;align-items:center;gap:.8rem;font-family:var(--marker);font-weight:700;font-size:1.9rem}
.race .from{color:var(--flame-ink);text-decoration:line-through;text-decoration-thickness:3px}
.race .to{color:var(--leaf)}
.race .arr{color:var(--muted);font-size:1.4rem}

.quote{margin:0;font-family:var(--marker);font-weight:700;font-size:1.25rem;line-height:1.15;color:var(--ink);
  border-left:5px solid var(--amber-2);padding:.2rem 0 .2rem .8rem}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.8rem;align-items:center}
.two.wl{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:.45rem;min-width:0}
@media (max-width:980px){.two,.two.wl,.pair,.dts{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}}


/* ================= ShopEasy: brand, customers, the sale ================= */
.brand{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--marker);font-weight:700;
  font-size:1.35rem;line-height:1;color:var(--ink)}
.brand svg{width:1.5em;height:1.5em;flex:0 0 auto}
.brand small{font-family:var(--hand);font-weight:400;font-size:.5rem;letter-spacing:1.3px;
  text-transform:uppercase;color:var(--muted);margin-left:.15rem}
.brand-row{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.sticker{display:inline-block;font-family:var(--marker);font-weight:700;font-size:1.05rem;line-height:1;
  color:var(--on-flame);background:var(--flame);border:2.5px solid var(--ink);border-radius:var(--wobble-2);
  padding:.22rem .6rem;transform:rotate(-3deg);box-shadow:var(--shadow-sm)}
.sticker.sv-hot{animation:hotPulse 1.3s ease-in-out infinite}

.custs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.55rem}
.cust{position:relative;display:grid;grid-template-columns:3.1rem 1fr;gap:.55rem;align-items:center;
  background:var(--card);border:2.5px solid var(--ink);border-radius:var(--wobble);padding:.4rem .65rem;
  box-shadow:var(--shadow-sm)}
.cust:nth-child(even){border-radius:var(--wobble-2);transform:rotate(.3deg)}
.cust:nth-child(odd){transform:rotate(-.25deg)}
.cust .av{width:3.1rem;height:3.1rem;border-radius:50%;background:var(--pencil-soft);border:2px solid var(--ink);
  overflow:hidden}
.cust .av svg{width:100%;height:100%;display:block}
.cust .nm{font-family:var(--marker);font-weight:700;font-size:1.02rem;line-height:1;color:var(--ink)}
.cust .mt{font-family:var(--hand);font-size:.56rem;color:var(--muted);margin-top:.1rem}
.cust .sp{font-family:var(--hand);font-size:.6rem;color:var(--ink-2);margin-top:.18rem}
.cust .sp b{font-family:var(--mono);font-size:.9em;color:var(--ink)}
.cust .tag{position:absolute;top:-.55rem;right:.5rem;font-family:var(--hand);font-size:.48rem;letter-spacing:1px;
  text-transform:uppercase;background:var(--amber);border:2px solid var(--ink);border-radius:var(--wobble-2);
  padding:.04rem .4rem;color:var(--ink)}
.stat .v .live{display:inline-block;width:.32em;height:.32em;border-radius:50%;background:var(--flame);
  vertical-align:middle;margin-left:.2em;animation:blip 1.2s ease-in-out infinite}
/* ================= live-code additions ================= */
/* the psql prompt above every query */
.run{display:flex;flex-direction:column;gap:.22rem;min-width:0}
.prompt{font-family:var(--mono);font-size:.46rem;color:var(--muted);letter-spacing:.2px;display:flex;
  align-items:center;gap:.4rem}
.prompt b{color:var(--pencil-2);font-weight:700}
.prompt .go{margin-left:auto;font-family:var(--hand);font-size:.5rem;letter-spacing:1.2px;text-transform:uppercase;
  padding:.04rem .45rem;border:2px solid var(--ink);border-radius:var(--wobble-2);background:var(--amber)}

/* a captured plan, printed line by line as if psql were streaming it */
.plan.out{font-size:.5rem;line-height:1.5;padding:.45rem .7rem;white-space:pre-wrap;overflow:hidden;
  background:var(--card)}
.plan.out.sm{font-size:.44rem}
.plan.out.lg{font-size:.58rem}
.plan .pl{display:block;opacity:0;animation:fadeIn .28s ease forwards}
.plan mark{border-radius:3px;padding:0 2px;color:var(--ink)}
.plan mark.bad{background:var(--flame-soft);outline:2px solid var(--flame);color:var(--flame-ink)}
.plan mark.good{background:var(--leaf-soft);outline:2px solid var(--leaf);color:var(--ink)}
.plan mark.key{background:var(--amber)}
.plan .err{color:var(--flame-ink);font-weight:700}
.plan .xt{font-weight:700;color:var(--ink)}

/* the timing badge under a plan */
.msb{display:flex;align-items:baseline;gap:.4rem;font-family:var(--hand);font-size:.56rem;letter-spacing:1px;
  text-transform:uppercase;color:var(--muted)}
.msb b{font-family:var(--marker);font-size:1.25rem;letter-spacing:0;text-transform:none}
.msb.bad b{color:var(--flame-ink)} .msb.good b{color:var(--leaf)}

.race.sm{font-size:1.35rem}
.race .x{font-family:var(--hand);font-size:.62rem;letter-spacing:1px;text-transform:uppercase;color:var(--ink);
  background:var(--amber);border:2px solid var(--ink);border-radius:var(--wobble-2);padding:.1rem .5rem}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1rem}
.foot{flex-wrap:nowrap;align-items:stretch}
.foot .tell{flex:1 1 0;min-width:0}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem .7rem}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem .7rem}
@media (max-width:980px){.grid2,.grid3{grid-template-columns:1fr}.foot{flex-wrap:wrap}}

/* ================= infographics ================= */
/* before/after speed bars, log scale */
.speed{flex:0 1 19rem;min-width:15rem;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.18rem .8rem;align-items:center;
  background:var(--card);border:2.5px solid var(--ink);border-radius:var(--wobble);padding:.35rem .7rem;box-shadow:var(--shadow-sm)}
.speed .sp{grid-column:1;display:grid;grid-template-columns:2.9rem minmax(0,1fr) 4rem;gap:.35rem;align-items:center;
  font-family:var(--hand);font-size:.52rem;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.speed .sp i{display:block;height:.72rem;width:var(--w);border:2px solid var(--ink);border-radius:3px;
  transform-origin:left;transform:scaleX(0);animation:growX .9s cubic-bezier(.22,1,.36,1) forwards}
.speed .sp.bad i{background:var(--flame)} .speed .sp.good i{background:var(--leaf);animation-delay:.25s}
.speed .sp b{font-family:var(--marker);font-size:.98rem;letter-spacing:0;text-transform:none}
.speed .sp.bad b{color:var(--flame-ink)} .speed .sp.good b{color:var(--leaf)}
.speed .x{grid-column:2;grid-row:1 / span 2;font-family:var(--marker);font-weight:700;font-size:1.3rem;line-height:1;
  color:var(--ink);background:var(--amber);border:2.5px solid var(--ink);border-radius:var(--wobble-2);padding:.25rem .55rem;
  transform:rotate(-2deg);text-align:center}
.speed .x small{display:block;font-family:var(--hand);font-weight:400;font-size:.46rem;letter-spacing:1px;text-transform:uppercase}

/* a concept drawing that holds the empty half of a slide until the fix arrives */
.art{display:flex;align-items:center;justify-content:center;min-height:0}
.art svg.scene{max-height:34vh}
.art-cap{font-family:var(--hand);font-size:.52rem;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);text-align:center}
.strip svg.scene{max-height:20vh}

/* horizontal size / share bars */
.hbars{display:grid;gap:.3rem;background:var(--card);border:2.5px solid var(--ink);border-radius:var(--wobble-2);
  padding:.45rem .7rem;box-shadow:var(--shadow-sm)}
.hb{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 4.2rem;gap:.5rem;align-items:center;font-family:var(--mono);font-size:.5rem}
.hb i{display:block;height:.8rem;width:var(--w);min-width:3px;border:2px solid var(--ink);border-radius:3px;background:var(--pencil);
  transform-origin:left;transform:scaleX(0);animation:growX .9s cubic-bezier(.22,1,.36,1) forwards}
.hb.bad i{background:var(--flame)} .hb.good i{background:var(--leaf)}
.hb b{font-family:var(--marker);font-size:.95rem}
.stack100{display:flex;height:1.5rem;border:2.5px solid var(--ink);border-radius:6px;overflow:hidden;box-shadow:var(--shadow-sm)}
.stack100 span{display:flex;align-items:center;justify-content:center;font-family:var(--hand);font-size:.5rem;color:var(--ink);
  border-right:2px solid var(--ink);white-space:nowrap;overflow:hidden;transform-origin:left;animation:growX .8s ease forwards}
.stack100 span:last-child{border-right:none}

/* icon chips in a row (scan ladder, command trio) */
.chips{display:flex;align-items:stretch;gap:.35rem;flex-wrap:wrap}
.chip{flex:1 1 0;display:flex;align-items:center;gap:.4rem;padding:.28rem .55rem;background:var(--card);border:2.5px solid var(--ink);
  border-radius:var(--wobble);box-shadow:var(--shadow-sm);font-family:var(--hand);font-size:.6rem;color:var(--ink-2);min-width:0}

<div id="ov"><h3>Run of show</h3><div class="ovgrid" id="ovGrid"></div></div>
<script>
/* =====================================================================
   Motion scenes — inline SVG infographics.
   Every scene takes the current step and returns markup; entrance
   animations are CSS classes, so a re-render replays only what changed.
   ===================================================================== */
/* ---- line-art icon set — stroked, inherits colour, reads at projector size ---- */
const ICON = {
  server:  'M3 4h18v6H3zM3 14h18v6H3zM7 7h.01M7 17h.01',
  db:      'M12 3c4.4 0 8 1.3 8 3s-3.6 3-8 3-8-1.3-8-3 3.6-3 8-3M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3',
  lock:    'M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4',
  grid:    'M3 3h18v18H3zM3 9h18M9 3v18',
  search:  'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16M21 21l-4.3-4.3',
  users:   'M16 19v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1M9 7a3 3 0 1 0 0 6 3 3 0 0 0 0-6M22 19v-1a4 4 0 0 0-3-3.9',
  cart:    'M2 3h2l2.4 12.5a2 2 0 0 0 2 1.5h9.7a2 2 0 0 0 2-1.6L21 7H6M9.5 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2M18 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2',
  bolt:    'M13 2 3 14h8l-1 8 10-12h-8z',
  trash:   'M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14',
  layers:  'M12 2 2 7l10 5 10-5zM2 12l10 5 10-5M2 17l10 5 10-5',
  ban:     'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M5.6 5.6l12.8 12.8',
  sigma:   'M18 5H6l6 7-6 7h12',
  clock:   'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M12 7v5l3 2',
  build:   'M3 21h18M5 21V7l7-4 7 4v14M9 21v-5h6v5',
  route:   'M6 3v12a3 3 0 0 0 3 3h9M15 15l3 3-3 3',
  shield:  'M12 3l8 3v6c0 5-3.5 8.3-8 9.5C7.5 20.3 4 17 4 12V6z',
  split:   'M6 3v6a3 3 0 0 0 3 3h9M6 21v-6a3 3 0 0 1 3-3M15 9l3 3-3 3',
  gauge:   'M12 21a9 9 0 1 1 9-9M12 12l5-3'
};
const ico = (n, c='currentColor') =>
  `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round"><path d="${ICON[n]||ICON.db}"/></svg>`;

/* ---- motion helpers -------------------------------------------------
   wire() draws a connector AND sends packets riding along it, so a query
   is visibly travelling rather than implied by a dashed line.          */
let flowSeq = 0;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
function wire(d, o = {}){
  const id  = 'fp' + (++flowSeq);
  const col = o.color || 'var(--blue)';
  const dur = o.dur || 1.8;
  const n   = o.packets == null ? 1 : o.packets;
  const cls = 'wire' + (o.live === false ? '' : ' live') + (o.cls ? ' ' + o.cls : '');
  let g = `<path id="${id}" d="${d}" class="${cls}"${o.stroke ? ` stroke="${o.stroke}"` : ''}/>`;
  if(!REDUCED) for(let i = 0; i < n; i++){
    g += `<circle r="${o.r || 5}" fill="${col}" class="packet">
      <animateMotion dur="${dur}s" repeatCount="indefinite"
        begin="${((o.delay || 0) + i * dur / n).toFixed(2)}s" rotate="auto">
        <mpath href="#${id}" xlink:href="#${id}"/></animateMotion></circle>`;
  }
  return g;
}

const SV = (vb, inner) => `<svg class="scene" viewBox="${vb}" preserveAspectRatio="xMidYMid meet">${inner}</svg>`;
const D  = n => `style="animation-delay:${n}ms"`;

/* ---- SQL on paper: escape, then weight the keywords. [[x]] marks a
   highlight, [[!x]] marks the part that is wrong. ---- */
const KW = /\b(SELECT|FROM|WHERE|AND|OR|IN|NOT|EXISTS|JOIN|ON|GROUP BY|ORDER BY|LIMIT|DESC|ASC|AS|WITH|RECURSIVE|MATERIALIZED|CREATE|INDEX|CONCURRENTLY|USING|INCLUDE|DISTINCT|SUM|COUNT|LOWER|UPPER|EXPLAIN|ANALYZE|BUFFERS|BETWEEN|LIKE|HASH|GIN|GIST|BRIN|UNION|INSERT|UPDATE|DELETE|CURRENT_DATE)\b/g;
const esc = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function sql(s, cls=''){
  const body = s.replace(/^\n/,'').replace(/\n\s*$/,'').split('\n').map(line => {
    const i = line.indexOf('--');
    let code = i >= 0 ? line.slice(0, i) : line;
    const com = i >= 0 ? line.slice(i) : '';
    code = esc(code)
      .replace(/'[^']*'/g, m => `<span class="st">${m}</span>`)
      .replace(KW, '<b>$1</b>')
      .replace(/\[\[!(.*?)\]\]/g, '<mark class="bad">$1</mark>')
      .replace(/\[\[(.*?)\]\]/g, '<mark>$1</mark>');
    return code + (com ? `<i>${esc(com)}</i>` : '');
  }).join('\n');
  return `<pre class="sql ${cls}">${body}</pre>`;
}
const tell = (k, v, cls='') => `<div class="tell ${cls}"><b>${k}</b><span>${v}</span></div>`;

/* ---- ShopEasy: the logo, the customers, the storefront ---- */
const LOGO_PATH = `<path d="M7 9h18l-1.6 17a2 2 0 0 1-2 1.8H10.6a2 2 0 0 1-2-1.8z" fill="var(--amber)" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>
  <path d="M11.5 12V8a4.5 4.5 0 0 1 9 0v4" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
  <path d="M19 15.5c-.8-1-2-1.4-3.2-1.4-1.7 0-2.9.9-2.9 2.1 0 2.8 6.4 1.6 6.4 4.5 0 1.3-1.3 2.2-3.2 2.2-1.4 0-2.7-.5-3.5-1.5" fill="none" stroke="var(--ink)" stroke-width="1.9" stroke-linecap="round"/>`;
const brand = (sub='') => `<span class="brand"><svg viewBox="0 0 32 32" aria-hidden="true">${LOGO_PATH}</svg>ShopEasy${sub?`<small>${sub}</small>`:''}</span>`;

/* hand-drawn portraits in a 100×100 box */
const PEOPLE = {
  aarav:{name:'Aarav Sharma', skin:'#C98D62', hair:'#2A1C13', shirt:'var(--pencil)',  style:'short'},
  diya: {name:'Diya Menon',   skin:'#B27650', hair:'#1D130E', shirt:'var(--flame)',   style:'long'},
  rohan:{name:'Rohan Iyer',   skin:'#A46B45', hair:'#22170F', shirt:'var(--leaf)',    style:'curly', glasses:true}
};
function face(k){
  const P = PEOPLE[k], ink = '#1C1A17';
  let g = '';
  if(P.style === 'long') g += `<path d="M27,42 C22,12 78,12 73,42 L78,82 C64,76 36,76 22,82 Z" fill="${P.hair}"/>`;
  g += `<path d="M8,104 C8,76 28,68 50,68 C72,68 92,76 92,104 Z" fill="${P.shirt}" stroke="${ink}" stroke-width="2.4"/>
    <rect x="43" y="58" width="14" height="13" fill="${P.skin}"/>
    <ellipse cx="50" cy="42" rx="20" ry="23" fill="${P.skin}" stroke="${ink}" stroke-width="2.4"/>`;
  if(P.style === 'short') g += `<path d="M29,40 C27,17 44,13 52,14 C67,14 75,23 71,40 C67,29 57,25 45,27 C38,28 32,33 29,40 Z" fill="${P.hair}"/>`;
  if(P.style === 'long')  g += `<path d="M30,38 C33,20 67,18 70,38 C61,28 41,28 30,38 Z" fill="${P.hair}"/>
    <circle cx="50" cy="31" r="1.8" fill="var(--flame)"/>`;
  if(P.style === 'curly') [[33,28],[41,21],[50,19],[59,21],[67,28],[37,35],[64,35]].forEach(c =>
      g += `<circle cx="${c[0]}" cy="${c[1]}" r="8" fill="${P.hair}"/>`);
  g += `<circle cx="42" cy="43" r="2.3" fill="${ink}"/><circle cx="58" cy="43" r="2.3" fill="${ink}"/>
    <path d="M43,53 Q50,58.5 57,53" fill="none" stroke="${ink}" stroke-width="2.2" stroke-linecap="round"/>`;
  if(P.glasses) g += `<circle cx="42" cy="43" r="6.5" fill="none" stroke="${ink}" stroke-width="2"/>
    <circle cx="58" cy="43" r="6.5" fill="none" stroke="${ink}" stroke-width="2"/><path d="M48.5,43 H51.5" stroke="${ink}" stroke-width="2"/>`;
  return g;
}
const avatar = k => `<svg viewBox="0 0 100 100" aria-label="${PEOPLE[k].name}">${face(k)}</svg>`;

/* customer cards: who they are, and (from step 1) what they bought this week */
function custCards(st){
  const C = [['aarav','Pune','since Apr 2023','2 orders · <b>₹10,698</b>',''],
             ['diya','Kochi','since Nov 2022','1 order · <b>₹12,250</b>','top spender'],

}

/* the storefront on sale day, and the orders it pours into the database */
function sceneSale(step){
  let g = `<rect x="20" y="10" width="600" height="380" rx="6" class="box"/>
    <path d="M20,44 H620" stroke="var(--ink)" stroke-width="2.4"/>
    ${[44,64,84].map((x,i)=>`<circle cx="${x}" cy="27" r="6" fill="${['var(--flame)','var(--amber)','var(--leaf)'][i]}" stroke="var(--ink)" stroke-width="1.6" class="nofx"/>`).join('')}
    <rect x="110" y="17" width="300" height="20" rx="10" fill="var(--paper-2)" stroke="var(--line)" stroke-width="1.6" class="nofx"/>
    <text class="t-mono" x="124" y="32" style="font-size:13px">shopeasy.in/black-friday</text>

    <text class="t-mono" x="584" y="160" text-anchor="end" style="fill:var(--on-flame);font-size:22px;font-weight:700">05:42:17</text>`;
  const items = [
    ['Wireless Earbuds Pro','₹1,499','₹4,999','-70%', `<circle cx="-14" cy="-6" r="11" fill="var(--pencil-soft)" stroke="var(--ink)" stroke-width="2.2"/><rect x="-18" y="2" width="7" height="20" rx="3" fill="var(--pencil-soft)" stroke="var(--ink)" stroke-width="2"/>
       <circle cx="14" cy="-6" r="11" fill="var(--pencil-soft)" stroke="var(--ink)" stroke-width="2.2"/><rect x="11" y="2" width="7" height="20" rx="3" fill="var(--pencil-soft)" stroke="var(--ink)" stroke-width="2"/>`],
    ['Cotton Bedsheet Set','₹4,501','₹8,999','-50%', `<rect x="-30" y="-14" width="60" height="14" rx="3" fill="var(--amber-soft)" stroke="var(--ink)" stroke-width="2.2"/><rect x="-30" y="0" width="60" height="14" rx="3" fill="var(--pencil-soft)" stroke="var(--ink)" stroke-width="2.2"/>
       <rect x="-30" y="14" width="60" height="12" rx="3" fill="var(--leaf-soft)" stroke="var(--ink)" stroke-width="2.2"/>`],
    ['Steel Water Bottle','₹4,083','₹5,999','-32%', `<rect x="-7" y="-26" width="14" height="9" rx="2" fill="var(--ink)" stroke="var(--ink)" stroke-width="2"/><rect x="-14" y="-17" width="28" height="46" rx="9" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="2.2"/>
       <path d="M-14,0 H14" stroke="var(--pencil)" stroke-width="3"/>`]];
  items.forEach((it, i) => {
    const x = 38 + i*192;
    g += `<g class="sv-rise" ${D(150 + i*120)}>
      <rect x="${x}" y="192" width="180" height="184" rx="4" fill="var(--card)" stroke="var(--ink)" stroke-width="2.2"/>
      <g transform="translate(${x+90},244)">${it[4]}</g>

      <text class="t-lbl" x="${x+12}" y="300" style="font-size:16px">${it[0]}</text>
      <text class="t-serif" x="${x+12}" y="330" style="font-size:24px">${it[1]}</text>
      <text class="t-sub" x="${x+92}" y="329" style="font-size:14px;text-decoration:line-through">${it[2]}</text>
      <rect x="${x+12}" y="342" width="156" height="24" rx="5" fill="var(--leaf)" stroke="var(--ink)" stroke-width="1.8" class="nofx"/>

  });
  if(step >= 2){
    g += wire('M620,200 C700,200 700,160 780,160', {packets:4, dur:1.1, color:'var(--flame)', r:6});
    g += wire('M620,300 C700,300 700,240 780,240', {packets:3, dur:1.3, color:'var(--flame)', r:6, delay:.3});
    g += `<g class="sv-pop">
      <ellipse cx="880" cy="120" rx="95" ry="22" fill="var(--pencil-soft)" stroke="var(--ink)" stroke-width="2.4"/>
      <path d="M785,120 V290 C785,302 828,312 880,312 C932,312 975,302 975,290 V120" fill="var(--pencil-soft)" stroke="var(--ink)" stroke-width="2.4"/>
      <path d="M785,175 C785,187 828,197 880,197 C932,197 975,187 975,175 M785,232 C785,244 828,254 880,254 C932,254 975,244 975,232" fill="none" stroke="var(--ink)" stroke-width="1.8"/>

      <text class="t-sub sv-fade" x="880" y="346" text-anchor="middle" style="font-size:15px">every order is a row the</text>
      <text class="t-sub sv-fade" x="880" y="366" text-anchor="middle" style="font-size:15px">dashboard has to read</text>`;
  }
  return SV('0 0 1000 395', g);
}

/* ---- the dashboard that stopped loading ---- */
function sceneTimeout(step){
  let g = `<rect x="30" y="20" width="420" height="250" rx="4" class="box"/>
    <g transform="translate(46,34) scale(.9)">${LOGO_PATH}</g>
    <text class="t-sub" x="78" y="54" style="font-size:14px">ShopEasy &middot; Marketing</text>
    <text class="t-serif" x="428" y="58" text-anchor="end" style="font-size:24px">Top Customers This Month</text>
    <path d="M52,76 H428" stroke="var(--line)" stroke-width="2"/>`;
  ['diya','aarav','rohan'].forEach((k,i) => g += `<g opacity=".55"><svg x="62" y="${84+i*30}" width="26" height="26" viewBox="0 0 100 100">${face(k)}</svg>
      <rect x="98" y="${93+i*30}" width="${190-i*40}" height="10" rx="3" fill="var(--line)" class="nofx"/></g>`);
  if(step < 1){
    g += `<circle cx="240" cy="200" r="30" fill="none" stroke="var(--pencil-2)" stroke-width="6"
            stroke-dasharray="130 60" stroke-linecap="round" class="sv-spin nofx"/>
      <text class="t-sub" x="240" y="252" text-anchor="middle">loading…</text>`;
  } else {
    g += `<g class="sv-pop"><circle cx="240" cy="198" r="30" fill="var(--flame)" stroke="var(--ink)" stroke-width="2.4" class="sv-hot"/>
      <path d="M228,186 L252,210 M252,186 L228,210" stroke="var(--on-flame)" stroke-width="5" stroke-linecap="round"/></g>
      <text class="t-lbl sv-fade" x="240" y="254" text-anchor="middle" style="fill:var(--flame-ink)">Query timed out after 30,000 ms</text>`;
  }
  if(step >= 2){
    g += `<g class="sv-rise">
      <text class="t-lbl" x="520" y="70">your laptop &middot; 500 test rows</text>
      <rect x="520" y="82" width="6" height="34" fill="var(--leaf)" stroke="var(--ink)" stroke-width="1.8" class="sv-growx"/>
      <text class="t-sub" x="540" y="106">fast</text>
      <text class="t-lbl" x="520" y="160">production &middot; 20,000,000 orders</text>
      <rect x="520" y="172" width="440" height="34" fill="var(--flame)" stroke="var(--ink)" stroke-width="1.8" class="sv-growx" ${D(250)}/>
      <text class="t-sub" x="960" y="232" text-anchor="end">30 s+ &mdash; sometimes never</text></g>`;
  }
  if(step >= 3) g += `<text class="t-sub sv-fade" x="740" y="266" text-anchor="middle"
      style="font-style:italic;font-size:17px">same SQL &mdash; 40,000&times; the rows</text>`;
  return SV('0 0 1000 290', g);
}

/* ---- four tables, drawn to scale by row count ---- */
const TABLES = [
  {t:'customers',   n:'~2,000,000',  v:2e6,  c:['customer_id PK','name','email','city','created_at']},
  {t:'orders',      n:'~20,000,000', v:2e7,  c:['order_id PK','customer_id FK','order_date','status','total_amount']},
  {t:'order_items', n:'~80,000,000', v:8e7,  c:['item_id PK','order_id FK','product_id FK','quantity','unit_price']},
  {t:'products',    n:'~50,000',     v:5e4,  c:['product_id PK','name','category','price','stock']}
];
function sceneTables(step){
  let g = '';
  TABLES.forEach((T, i) => {
    if(step < i) return;
    const x = 20 + i*245, w = 220;

      g += `<g class="sv-rise" ${D(i*120)}>
        <rect x="600" y="${50+i*62}" width="120" height="46" rx="3" fill="${hit ? 'var(--amber)' : 'var(--pencil-soft)'}" stroke="var(--ink)" stroke-width="2.2"/>
        <text class="t-lbl" x="660" y="${80+i*62}" text-anchor="middle">${l[0]}</text>
        <text class="t-mono" x="740" y="${79+i*62}" style="font-size:16px">&rarr; ${l[1]}</text></g>`;
    });
  }
  if(step >= 2){
    [1,2,3].forEach((r,i) => g += wire(`M600,73 C480,73 440,${61+r*52} 320,${61+r*52}`, {packets:1, dur:1.1, delay:i*.2, color:'var(--leaf)'}));
    g += `<text class="t-mono sv-fade" x="600" y="260" style="font-size:15px">tags @&gt; '{sale}' &rarr; read one list</text>`;
  }
  return SV('0 0 1000 272', g);
}

/* ---- GiST: bounding boxes, prune whole regions ---- */
function sceneGist(step){
  const pr = step >= 1;
  const pts = [[110,90],[150,160],[210,110],[260,200],[190,230],[420,80],[470,130],[540,200],[590,240],[510,90]];
  let g = `<rect x="30" y="20" width="620" height="260" rx="3" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="2"/>`;
  g += `<rect x="60" y="50" width="250" height="210" rx="3" fill="none" stroke="var(--pencil-2)" stroke-width="3" ${pr ? 'opacity=".3"' : ''}/>
    <text class="t-lbl" x="70" y="46" ${pr ? 'opacity=".3"' : ''}>A</text>
    <rect x="380" y="50" width="250" height="210" rx="3" fill="${pr ? 'var(--amber-soft)' : 'none'}" stroke="var(--pencil-2)" stroke-width="3"/>
    <text class="t-lbl" x="390" y="46">B</text>
    <rect x="400" y="64" width="160" height="92" rx="3" fill="${step >= 2 ? 'var(--amber)' : 'none'}" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 5"/>
    <text class="t-sub" x="410" y="176">B1</text>
    <rect x="490" y="176" width="126" height="76" rx="3" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 5" ${step >= 2 ? 'opacity=".35"' : ''}/>`;
  pts.forEach((p,i) => g += `<circle cx="${p[0]}" cy="${p[1]}" r="7" fill="var(--pencil-2)" class="nofx" ${pr && i < 5 ? 'opacity=".25"' : ''}/>`);
  g += `<circle cx="455" cy="108" r="10" fill="var(--flame)" stroke="var(--ink)" stroke-width="2" class="sv-hot nofx"/>
    <text class="t-lbl" x="470" y="112" style="fill:var(--flame-ink)">you</text>`;
  const tn = (x, y, t, dim, lit) => `<rect x="${x-34}" y="${y}" width="68" height="36" rx="3" fill="${lit ? 'var(--amber)' : 'var(--card)'}"
      stroke="var(--ink)" stroke-width="2" ${dim ? 'opacity=".3"' : ''}/><text class="t-lbl" x="${x}" y="${y+25}" text-anchor="middle" ${dim ? 'opacity=".3"' : ''}>${t}</text>`;
  g += `<path d="M820,76 L740,120 M820,76 L900,120 M740,156 L700,210 M740,156 L780,210 M900,156 L860,210 M900,156 L940,210" class="wire"/>`;
  g += tn(820, 40, 'root') + tn(740, 120, 'A', pr) + tn(900, 120, 'B', false, pr) +
       tn(700, 210, 'A1', pr) + tn(780, 210, 'A2', pr) + tn(860, 210, 'B1', false, step >= 2) + tn(940, 210, 'B2', step >= 2);
  if(pr) g += `<text class="t-sub sv-fade" x="740" y="276" text-anchor="middle" style="fill:var(--flame-ink)">A pruned whole</text>`;
  return SV('0 0 1000 290', g);
}

/* ---- BRIN: min / max per block range ---- */
function sceneBrin(step){
  const R = [['blocks 1–64','09-01','09-30',false],['blocks 65–128','10-01','10-31',false],['blocks 129–192','11-01','11-30',true]];
  let g = `<text class="t-mono" x="20" y="28" style="font-size:17px">query: created_at &ge; '11-01'</text>`;
  R.forEach((r,i) => {
    const y = 50 + i*64;
    const shown = step > i;
    g += `<rect x="20" y="${y}" width="620" height="50" rx="3" fill="${shown && r[3] ? 'var(--amber)' : 'var(--card)'}"
            stroke="var(--ink)" stroke-width="2.2" ${shown && !r[3] ? 'opacity=".5"' : ''}/>
      <text class="t-lbl" x="40" y="${y+32}">${r[0]}</text>
      <text class="t-mono" x="260" y="${y+31}">min ${r[1]}</text>
      <text class="t-mono" x="420" y="${y+31}">max ${r[2]}</text>`;
    if(shown) g += `<text class="t-lbl sv-pop" x="680" y="${y+32}" style="fill:${r[3] ? 'var(--leaf)' : 'var(--flame-ink)'}">${r[3] ? '&check; scan' : '&#10005; skip — max &lt; 11-01'}</text>`;
  });
  if(step >= 3) g += `<text class="t-sub sv-fade" x="20" y="262">three rows of summary for 192 blocks &mdash; the index is kilobytes</text>`;
  return SV('0 0 1000 276', g);
}

/* ---- composite index: leftmost prefix ---- */
function sceneComposite(step){
  const E = [[1017,'2025-11-12'],[1024,'2025-09-03'],[1024,'2025-10-21'],[1024,'2025-11-28'],[1024,'2025-11-29'],
             [2087,'2025-10-02'],[2087,'2025-11-28'],[3391,'2025-08-15'],[3391,'2025-11-30']];
  let g = `<text class="t-lbl" x="30" y="24">index entries, sorted by (customer_id, order_date)</text>`;
  E.forEach((e,i) => {
    const y = 38 + i*31;
    let lit = false, bad = false;
    if(step === 1) lit = e[0] === 1024;
    if(step === 2) lit = e[0] === 1024 && e[1] > '2025-11-01';
    if(step >= 3) bad = e[1] > '2025-11-01';
    g += `<rect x="30" y="${y}" width="330" height="26" rx="2" fill="${lit ? 'var(--amber)' : bad ? 'var(--flame-soft)' : 'var(--card)'}"
            stroke="${bad ? 'var(--flame)' : 'var(--ink)'}" stroke-width="1.8" class="nofx"/>
      <text class="t-mono" x="46" y="${y+18}" style="font-size:14px;font-weight:700;fill:var(--ink)">${e[0]}</text>
      <text class="t-mono" x="160" y="${y+18}" style="font-size:14px">${e[1]}</text>`;
  });
  const msg = [
    ['A phone book: sorted by surname, then first name.', 'var(--ink-2)'],
    ['&check; customer_id = 1024 — one contiguous block', 'var(--leaf)'],
    ['&check; + order_date &gt; 11-01 — a slice of that block', 'var(--leaf)'],
    ['&#10005; order_date &gt; 11-01 alone — scattered everywhere', 'var(--flame-ink)']][Math.min(step,3)];
  g += `<text class="t-lbl sv-fade" x="410" y="150" style="font-size:21px;fill:${msg[1]}">${msg[0]}</text>`;
  if(step >= 3) g += `<text class="t-sub sv-fade" x="410" y="186">like finding everyone named "Riya" in a phone book sorted by surname</text>`;
  return SV('0 0 1000 322', g);
}

/* ---- every write updates every index ---- */
function sceneWriteCost(step){
  let g = `<rect x="20" y="100" width="170" height="60" class="box-orange"/>
    <text class="t-lbl" x="105" y="136" text-anchor="middle" style="fill:var(--on-flame)">INSERT 1 row</text>`;
  const T = ['orders (heap)','idx customer_id','idx order_date','idx status','idx (cust, date)'];
  T.forEach((t,i) => {
    if(i > 0 && step < 1) return;
    const y = 10 + i*50;
    g += wire(`M190,130 C300,130 300,${y+20} 420,${y+20}`, {packets:1, dur:1.1, delay:i*.12, color:'var(--flame)'});
    g += `<g class="sv-rise" ${D(i*90)}><rect x="420" y="${y}" width="240" height="40" class="${i ? 'box' : 'box-purple'}"/>
      <text class="t-lbl" x="540" y="${y+26}" text-anchor="middle">${t}</text></g>`;
  });
  if(step >= 1) g += `<text class="t-lbl sv-fade" x="700" y="120">one row written,</text>
      <text class="t-lbl sv-fade" x="700" y="148" style="fill:var(--flame-ink)">five structures updated</text>`;
  return SV('0 0 1000 262', g);
}

/* ---- before / after ---- */
function sceneVictory(step){
  let g = `<text class="t-lbl" x="20" y="47" style="font-size:20px;fill:var(--flame-ink)">BEFORE &middot; Seq Scan</text>
    <rect x="240" y="20" width="700" height="40" fill="var(--flame)" stroke="var(--ink)" stroke-width="2" class="sv-growx nofx"/>
    <text class="t-serif" x="930" y="50" text-anchor="end" style="font-size:24px;fill:var(--on-flame)">2,140 ms</text>`;
  if(step >= 1) g += `<g class="sv-rise"><text class="t-lbl" x="20" y="117" style="font-size:20px;fill:var(--leaf)">AFTER &middot; Index Only Scan</text>
    <rect x="240" y="90" width="3" height="40" fill="var(--leaf)" stroke="var(--ink)" stroke-width="2" class="nofx"/>
    <text class="t-serif" x="256" y="120" style="font-size:24px;fill:var(--leaf)">3.2 ms</text></g>`;
  if(step >= 2) g += `<text class="t-big sv-pop" x="600" y="126" style="fill:var(--ink)">~670&times; less time</text>`;
  return SV('0 0 1000 150', g);
}

</script>

<script src="plans.js"></script>
<script>
/* =====================================================================
   Deck — Query-Level Optimization, live-code edition.
   Every plan on screen comes from PLANS (plans.js), which build/capture.py
   records by running the query against the shopeasy database.
   ===================================================================== */
const card = (k,t,p,cls='',ico='') =>
  `<div class="card ${cls}">${ico?`<span class="ico">${ico}</span>`:''}
     <h4>${k}</h4><h3>${t}</h3><p>${p}</p></div>`;

const quiz = (qs, st, cols=1) => `<div class="quiz-head">${sceneThink()}<p class="lede">Answer out loud before the next press &mdash; then we check it against the plan.</p></div><div class="qa" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">
  ${qs.map((q,i) => st >= 2*i ? `<div class="q pop"><h3><span>Q${i+1}</span>${q[0]}</h3>
     ${st >= 2*i+1 ? `<p class="pop">&rarr; ${q[1]}</p>` : `<p class="wait">…</p>`}</div>` : '').join('')}</div>`;
const quizSteps = (qs, intro) => qs.flatMap((q,i) => [
  {note:(i === 0 && intro ? intro + ' ' : '') + 'Read it out and wait for hands. Do not answer it yourself.'},
  {note:q[2] || ('Answer: ' + q[1].replace(/<[^>]+>/g,''))}]);

/* ---------- reading the captures ---------- */
const P  = id => PLANS[id] || {text:'(not captured — run build/capture.py)', sql:'', mode:'raw', ms:null};
const MS = id => P(id).ms;
function fmt(v){
  if(v == null) return '—';
  if(v >= 1000) return Math.round(v).toLocaleString('en-IN') + ' ms';
  if(v >= 100)  return Math.round(v) + ' ms';
  if(v >= 10)   return v.toFixed(1) + ' ms';
  if(v >= 1)    return v.toFixed(2) + ' ms';
  return v.toFixed(3) + ' ms';
}
function times(a, b){
  const x = a / b;
  return x >= 100 ? Math.round(x).toLocaleString('en-IN') + '&times;' : x >= 10 ? Math.round(x) + '&times;' : x.toFixed(1) + '&times;';
}
const PREFIX = {analyze:'EXPLAIN ANALYZE', explain:'EXPLAIN', buffers:'EXPLAIN (ANALYZE, BUFFERS)', raw:''};

/* Print a captured plan. marks = {bad:[], good:[], key:[]} of strings or
   RegExps; brief drops the cost=a..b part so long nodes fit one line. */
function plan(id, marks = {}, o = {}){
  let t = P(id).text;
  if(o.brief) t = t.replace(/cost=[\d.]+\.\.[\d.]+ /g, '');
  if(o.bare)  t = t.replace(/\s*\((cost|rows|actual)[^)]*\)/g, '');
  if(o.lean)  t = t.replace(/\(rows=\d+ width=\d+\) /g, '').replace(/time=[\d.]+\.\.[\d.]+ /g, '');
  if(o.only)  t = t.split('\n').filter((l, i) => o.only(l, i)).join('\n');
  const spans = [];
  for(const cls of ['bad','good','key']) for(const m of (marks[cls] || [])){
    const re = m instanceof RegExp ? new RegExp(m.source, 'g') : new RegExp(m.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
    let r; while((r = re.exec(t))){ spans.push([r.index, r.index + r[0].length, cls]); if(!r[0].length) re.lastIndex++; }
  }
  spans.sort((a, b) => a[0] - b[0]);
  let html = '', at = 0;
  for(const [s, e, cls] of spans){
    if(s < at) continue;
    html += esc(t.slice(at, s)) + `<mark class="${cls}">${esc(t.slice(s, e))}</mark>`;
    at = e;
  }
  html += esc(t.slice(at));
  html = html.split('\n').map((l, i) => {
    const cls = /ERROR/.test(l) ? ' err' : /Execution Time/.test(l) ? ' xt' : '';
    return `<span class="pl${cls}" style="animation-delay:${Math.min(i * 45, 900)}ms">${l || ' '}</span>`;
  }).join('');
  return `<pre class="plan out ${o.size || ''}">${html}</pre>`;
}

/* the psql prompt + the query. show = the SQL as set on the slide, with
   [[mark]] / [[!bad]] highlights; defaults to the captured text. */
function run(id, o = {}){
  const c = P(id), pre = o.prefix != null ? o.prefix : PREFIX[c.mode];
  return `<div class="run">
    <div class="prompt">shopeasy=#${pre ? ` <b>${pre}</b>` : ''}${o.go ? '<span class="go">run</span>' : ''}</div>
    ${sql(o.show || c.sql, o.sqlSize || 'sm')}</div>`;
}
const badge = (id, cls, label='Execution time') => MS(id) == null ? '' :
  `<div class="msb ${cls} pop">${label} <b>${fmt(MS(id))}</b></div>`;
const race = (a, b, cls='') => `<div class="race ${cls} pop"><span class="from">${fmt(a)}</span><span class="arr">&rarr;</span>
  <span class="to">${fmt(b)}</span><span class="x">${times(a, b)} less time</span></div>`;

/* =====================================================================
   Infographics — small drawings that explain the idea while the query
   is on screen. None of them adds a step; each rides an existing one.
   ===================================================================== */
const swap = (svg, pairs) => pairs.reduce((s, [a, b]) => s.split(a).join(b), svg);
const loopsScene = st => swap(sceneLoops(st), [['2,000,000', '200,000']]);
const statsScene = st => swap(sceneStats(st), [['rows=100', 'rows≈2,200'], ['2,000,000', '300,000']]);
const trapScene  = st => swap(sceneTrap(st),  [['20,000,000 rows', '2,000,000 rows']]);

/* before vs after as two bars on a log scale */
function speed(a, b){
  const w = v => Math.min(100, Math.max(1.2, (Math.log10(v) + 3) / 7.3 * 100));
  return `<div class="speed pop">
    <div class="sp bad"><span>before</span><i style="--w:${w(a).toFixed(1)}%"></i><b>${fmt(a)}</b></div>
    <div class="sp good"><span>after</span><i style="--w:${w(b).toFixed(1)}%"></i><b>${fmt(b)}</b></div>
    <span class="x">${times(a, b)}<small>less time</small></span></div>`;
}
/* horizontal bars for sizes or counts; v in any unit, scaled linearly or by log */
function hbars(rows, log){
  const max = Math.max(...rows.map(r => r[1]));
  const w = v => log ? Math.max(2, Math.log10(v + 1) / Math.log10(max + 1) * 100) : Math.max(1, v / max * 100);
  return `<div class="hbars pop">${rows.map((r, i) => `<div class="hb ${r[3] || ''}"><span>${r[0]}</span>
    <i style="--w:${w(r[1]).toFixed(1)}%;animation-delay:${i * 150}ms"></i><b>${r[2]}</b></div>`).join('')}</div>`;
}
const chips = (items, on = -1) => `<div class="chips">${items.map((c, i) =>
  (i ? '<span class="chip-arr">&rarr;</span>' : '') +
  `<div class="chip pop d${i + 1} ${i === on ? 'on' : ''}">${ico(c[0])}<span><b>${c[1]}</b><br>${c[2]}</span></div>`).join('')}</div>`;

/* box + label helper for the small scenes */
const bx = (x, y, w, h, t, o = {}) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${o.fill || 'var(--card)'}"
    stroke="var(--ink)" stroke-width="2.4" ${o.cls ? `class="${o.cls}"` : ''}/>
  ${t ? `<text class="t-lbl" x="${x + w / 2}" y="${y + h / 2 + 6}" text-anchor="middle" style="font-size:${o.fs || 17}px;${o.tc ? 'fill:' + o.tc : ''}">${t}</text>` : ''}`;
const arrow = (d, col = 'var(--ink)') => `<path d="${d}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ah)"/>`;
const AH = `<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/></marker></defs>`;
const ban = (cx, cy) => `<g class="sv-pop"><circle cx="${cx}" cy="${cy}" r="16" fill="var(--flame-soft)" stroke="var(--flame)" stroke-width="3.2" class="nofx"/>
  <path d="M${cx - 11},${cy - 11} L${cx + 11},${cy + 11}" stroke="var(--flame)" stroke-width="3.2"/></g>`;
const tick = (cx, cy) => `<g class="sv-pop"><circle cx="${cx}" cy="${cy}" r="16" fill="var(--leaf-soft)" stroke="var(--leaf)" stroke-width="3.2" class="nofx"/>
  <path d="M${cx - 8},${cy} l6,6 l10,-12" fill="none" stroke="var(--leaf)" stroke-width="3.4" stroke-linecap="round"/></g>`;

/* sargable: the index is keyed on the bare column */
function sceneSarg(step, o){
  let g = AH + `<text class="t-lbl" x="300" y="22" text-anchor="middle" style="font-size:16px;fill:var(--muted)">${o.idx}</text>`;
  o.keys.forEach((k, i) => g += bx(200, 34 + i * 34, 200, 30, k, {fs:14, fill: i === o.hit ? 'var(--amber)' : 'var(--card)'}));
  g += `<g class="sv-rise">${bx(10, 210, 250, 40, o.bad, {fs:15, fill:'var(--flame-soft)'})}</g>
    <path d="M135,210 C135,180 150,160 166,156" fill="none" stroke="var(--flame)" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="6 6"/>${ban(182, 152)}
    <text class="t-sub" x="135" y="276" text-anchor="middle" style="font-size:14px;fill:var(--flame-ink)">no key looks like this &rarr; Seq Scan</text>`;
  if(step >= 1) g += `<g class="sv-rise">${bx(340, 210, 250, 40, o.good, {fs:15, fill:'var(--leaf-soft)'})}
    ${arrow(`M465,210 C465,180 440,${54 + o.hit * 34} 404,${49 + o.hit * 34}`, 'var(--leaf)')}</g>${tick(500, 180)}
    <text class="t-sub sv-fade" x="465" y="276" text-anchor="middle" style="font-size:14px;fill:var(--leaf)">matches the key &rarr; Index Scan</text>`;
  return SV('0 0 600 290', g);
}

/* a sort that does not fit in work_mem spills to disk */
function sceneSpill(step){
  let g = AH + bx(20, 30, 200, 120, '', {fill:'var(--pencil-soft)'}) +
    `<text class="t-lbl" x="120" y="22" text-anchor="middle" style="font-size:16px">work_mem = 1 MB</text>`;
  for(let i = 0; i < 6; i++) g += `<rect x="34" y="${44 + i * 16}" width="172" height="11" rx="2" fill="var(--flame)" class="nofx sv-fade" ${D(i * 60)}/>`;
  g += arrow('M220,90 C280,90 290,130 330,140', 'var(--flame)') +
    `<g class="sv-rise"><ellipse cx="420" cy="122" rx="80" ry="18" fill="var(--flame-soft)" stroke="var(--ink)" stroke-width="2.4"/>
      <path d="M340,122 V200 C340,212 376,222 420,222 C464,222 500,212 500,200 V122" fill="var(--flame-soft)" stroke="var(--ink)" stroke-width="2.4"/>
      <text class="t-lbl" x="420" y="178" text-anchor="middle" style="font-size:16px">temp files on disk</text></g>
    <text class="t-sub" x="120" y="176" text-anchor="middle" style="font-size:14px;fill:var(--flame-ink)">2M rows don't fit &rarr; external merge</text>`;
  if(step >= 1) g += `<g class="sv-rise">${bx(20, 210, 300, 60, 'work_mem = 256 MB · quicksort in memory', {fs:14, fill:'var(--leaf-soft)'})}</g>${tick(340, 240)}`;
  return SV('0 0 520 280', g);
}

/* OR across tables: join everything then filter, vs two index seeks */
function sceneUnion(step){
  let g = AH + `<g>${bx(10, 20, 150, 46, 'orders · 2M', {fs:15})}${bx(10, 80, 150, 46, 'customers · 200k', {fs:15})}</g>
    ${arrow('M160,43 C200,43 200,70 228,72')}${arrow('M160,103 C200,103 200,80 228,78')}
    ${bx(232, 50, 120, 50, 'Hash Join', {fs:15, fill:'var(--flame-soft)'})}${arrow('M352,75 L392,75', 'var(--flame)')}
    ${bx(396, 50, 120, 50, 'OR filter', {fs:15, fill:'var(--flame-soft)'})}
    <text class="t-sub" x="456" y="124" text-anchor="middle" style="font-size:13px;fill:var(--flame-ink)">2M joined, 17 kept</text>`;
  if(step >= 1) g += `<g class="sv-rise">
    ${bx(10, 160, 150, 40, 'email index', {fs:14, fill:'var(--leaf-soft)'})}${bx(10, 214, 150, 40, 'primary key', {fs:14, fill:'var(--leaf-soft)'})}
    ${arrow('M160,180 L232,190', 'var(--leaf)')}${arrow('M160,234 L232,214', 'var(--leaf)')}
    ${bx(236, 180, 120, 46, 'UNION', {fs:16, fill:'var(--amber)'})}${arrow('M356,203 L396,203', 'var(--leaf)')}
    ${bx(400, 180, 116, 46, '17 rows', {fs:16, fill:'var(--leaf-soft)'})}
    <text class="t-sub" x="160" y="276" text-anchor="middle" style="font-size:13px;fill:var(--leaf)">each branch seeks its own index</text></g>`;
  return SV('0 0 520 285', g);
}

/* show 20, don't sort 2,000,000 */
function sceneFunnel(step){
  let g = AH;

function versus(o){
  const B = o.bad, G = o.good;
  const col = (x, st, from, cls, mark) => { cls = x.cls || cls; mark = x.cls ? (x.cls === 'good' ? '&check;' : '&#10005;') : mark;
    return `<div class="${st > from ? '' : 'pop'}">
      <span class="verdict ${cls}">${mark} ${x.label}</span>
      ${run(x.id, {show:x.show, prefix:x.prefix})}
      ${st >= from + 1 ? plan(x.id, x.marks, {brief:x.brief !== false, lean:o.lean, size:x.size || o.size, only:x.only || (o.trim ? TRIM : null)}) + (o.noBadge ? '' : badge(x.id, cls)) : ''}</div>`; };
  return {
    id:o.id, kick:o.kick, eyebrow:o.eyebrow, title:o.title, tag:o.tag || 'scenario',
    steps:o.notes.map(n => ({note:n})),
    body:(st)=>`${o.why ? `<p class="lede">${o.why}</p>` : ''}
      <div class="pair">${col(B, st, 0, 'bad', '&#10005;')}
        ${st >= 2 ? col(G, st, 2, 'good', '&check;') : (o.art ? `<div class="art ${st ? '' : 'pop'}">${o.art(st)}</div>` : '<div></div>')}</div>
      ${st >= 4 ? `<div class="foot pop">${tell('Plan tell', o.tell)}
        ${!o.noRace && MS(B.id) != null && MS(G.id) != null ? speed(MS(B.id), MS(G.id)) : ''}</div>` : ''}`
  };
}

/* ---------- a log-scale race between timings ---------- */
function sceneBars(rows, step, narrow){
  const lo = -3, hi = 4.2;                                   // 0.001 ms … ~16 s
  const VW = narrow ? 560 : 1000, x0 = narrow ? 200 : 300, W = narrow ? 270 : 640;
  const fs = narrow ? 1.25 : 1;
  const wOf = v => Math.max(4, (Math.log10(v) - lo) / (hi - lo) * W);
  let g = '';
  [0.01, 1, 100, 10000].forEach(v => {
    const x = x0 + wOf(v);
    g += `<path d="M${x},6 V${rows.length * 46 + 6}" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 5"/>
      <text class="t-sub" x="${x}" y="${rows.length * 46 + 26}" text-anchor="middle" style="font-size:${13*fs}px">${v >= 1 ? v.toLocaleString('en-IN') : v} ms</text>`;
  });
  rows.forEach((r, i) => {
    if(step < (r.at || 0)) return;
    const y = 12 + i * 46, w = wOf(r.ms);
    g += `<g class="sv-rise" ${D(i * 90)}>
      <text class="t-lbl" x="${x0 - 12}" y="${y + 23}" text-anchor="end" style="font-size:${16*fs}px">${r.label}</text>
      <rect x="${x0}" y="${y}" width="${w}" height="30" fill="${r.good ? 'var(--leaf)' : 'var(--flame)'}" stroke="var(--ink)"
            stroke-width="1.8" class="sv-growx nofx" ${D(120 + i * 90)}/>
      <text class="t-serif" x="${x0 + w + 8}" y="${y + 24}" style="font-size:${20*fs}px;fill:${r.good ? 'var(--leaf)' : 'var(--flame-ink)'}">${r.txt || fmt(r.ms)}</text></g>`;
  });
  return SV(`0 0 ${VW} ${rows.length * 46 + 34}`, g);
}

INSERT INTO orders
SELECT g,
       1 + floor(random() * 200000),       -- customer
       CURRENT_DATE - floor(random() * 1095)::int,
       CASE WHEN r < 0.95 THEN 'delivered' ... END,
       round((99 - ln(1 - random()) * 900)::numeric, 2)
FROM generate_series(1, 2000000) g;

ALTER TABLE orders ADD FOREIGN KEY ([[!customer_id]])
  REFERENCES customers;   -- no index is created for it`,'sm')}
        <p class="art-cap">the three customers we follow all lecture</p>${custCards(1)}</div>
      <div class="stack">${st>=1?run('sizes')+hbars(rawRows('sizes').map(c=>[c[0], +c[1].replace(/,/g,''), c[1]+' rows', /order/.test(c[0])?'bad':''])) +
        hbars(rawRows('sizes').map(c=>[c[0], toKB(c[2]), c[2]])) : `<div class="art">${sceneSale(2)}</div>`}</div>
    </div>` },
